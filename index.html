<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>K-LIST</title>
<style>
  :root{--bg:#0b0b0f;--panel:#17171f;--fg:#f2f2f5;--mut:#8b8b99;--acc:#e5484d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
  header{position:relative;z-index:5;padding:4px 12px 4px;padding-top:calc(4px + env(safe-area-inset-top))}
  .hrow{display:flex;gap:8px;align-items:center;margin:4px 0}
  .sp{flex:1}
  button{background:var(--panel);color:var(--fg);border:0;border-radius:8px;padding:9px 14px;font:inherit}
  button.p{background:var(--acc)}
  header button:not(.ddb){padding:9px 11px}
  .ddb{background:none;padding:7px 0;font-size:15px;font-weight:600;color:var(--mut);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
  .ddb.act{color:var(--acc);font-weight:700}
  .menu{display:none;position:absolute;top:0;left:0;background:var(--panel);border-radius:10px;min-width:210px;z-index:20;box-shadow:0 8px 24px #000a;overflow:hidden}
  .menu.on{display:block}
  .menu button{display:flex;justify-content:space-between;gap:16px;width:100%;background:none;border-radius:0;padding:13px 14px;text-align:left}
  .menu button.cur{color:var(--acc);font-weight:700}
  .menu button span{color:var(--mut);font-weight:400}
  #grid,.res,.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  #grid{padding:8px 12px 40px}
  .c{aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--panel);position:relative}
  .c img{width:100%;height:100%;object-fit:cover;display:block}
  .c span{position:absolute;inset:auto 0 0 0;padding:4px;font-size:10px;background:linear-gradient(transparent,#000c)}
  .ck{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:#2ea043;color:#fff;font-style:normal;font-size:11px;line-height:18px;text-align:center}
  .it{cursor:pointer;min-width:0}
  .t{font-size:11px;line-height:1.25;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .y{font-size:10px;color:var(--mut);margin-top:1px}
  .yh{grid-column:1/-1;font-weight:700;font-size:16px;padding:12px 2px 2px}
  #empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
  .sheet{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column}
  .sheet.on{display:flex}
  .bar{display:flex;gap:8px;padding:10px 12px;align-items:center}
  .bar input{flex:1}
  input,select{background:var(--panel);color:var(--fg);border:1px solid #2a2a36;border-radius:8px;padding:10px;font:inherit;min-width:0}
  .body{overflow:auto;padding:0 12px 24px;flex:1}
  .res .c,.pg .c{cursor:pointer}
  .res .c.done{opacity:.35}
  @media (orientation:portrait){#grid,.res,.pg{grid-template-columns:repeat(3,1fr)}}
  @media (orientation:landscape){#grid,.res,.pg{grid-template-columns:repeat(var(--cl,6),1fr)}}
  label{display:block;margin:14px 0 4px;color:var(--mut);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .msg{color:var(--mut);padding:16px 0}

  /* scheda */
  .fab{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:3;width:40px;height:40px;padding:0;border-radius:50%;background:rgba(0,0,0,.55);font-size:20px;line-height:40px}
  #detail .body{padding:0}
  .hero{height:190px;background:linear-gradient(135deg,#23233a,#12121c) center/cover no-repeat}
  .hero i{display:block;height:100%;background:linear-gradient(transparent 40%,var(--bg))}
  .head{display:flex;gap:14px;padding:0 14px;align-items:flex-start}
  .head .c{width:clamp(110px,34vw,160px);flex:none;margin-top:-80px;box-shadow:0 6px 18px #000a;cursor:zoom-in}
  .info{padding-top:12px;min-width:0}
  .info h2{margin:0 0 6px;font-size:21px;line-height:1.2}
  .sub{color:var(--mut)}
  .pad{padding:0 14px 28px}
  .genrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
  .genrow[hidden]{display:none}
  .gen{color:#b9b9c6;font-size:14px;flex:1;min-width:0}
  .trb{background:none;color:#4da3ff;font-weight:600;font-size:14px;padding:6px 0 6px 10px;white-space:nowrap;flex:none}
  .trb[hidden]{display:none}
  .mrow{display:flex;gap:8px;overflow-x:auto;margin:4px 0 6px;padding-bottom:2px;scrollbar-width:none}
  .mrow::-webkit-scrollbar{display:none}
  .mrow button{flex:none;white-space:nowrap}
  .csrow{margin-top:18px}
  .mlbtn{display:block;margin:18px auto 6px}
  .credit{text-align:center;color:#6b6b78;font-size:10px;margin:22px 0 6px}
  .mgrp{margin-top:14px;padding-top:2px}
  .vote{width:46px;height:46px;margin-bottom:8px;position:relative}
  .vote[hidden]{display:none}
  .vote svg{display:block}
  .vote b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
  .vote b small{font-size:8px;font-weight:600;margin:-6px 0 0 1px}
  .links{display:flex;gap:30px;flex-wrap:wrap}
  .fab.home{left:auto;right:10px;display:flex;align-items:center;justify-content:center}
  .bar .hm{display:flex;align-items:center;justify-content:center;padding:9px 12px}
  .sh{margin:34px 0 0;font-size:17px;font-weight:700}
  .sh.first{margin-top:6px}
  .stats{display:flex;gap:12px;margin-top:12px}
  .sc{flex:1;min-width:0;background:var(--panel);border-radius:16px;padding:16px 10px;text-align:center}
  .sc h4{margin:0;font-size:13px;letter-spacing:.5px;font-weight:600}
  .sc .big{font-size:22px;font-weight:700;margin:12px 0 6px}
  .sc .lab{font-size:13px}
  .sc .sm{font-size:12px;color:var(--mut);margin-top:8px}
  .savebar{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid #23232e}
  .savebar button{width:100%;padding:13px}
  .ep .et{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  #dPlot{line-height:1.5;margin:18px 0 0;color:#d6d6de}
  .linkbtn{display:inline-block;background:none;padding:14px 4px 6px 0;color:#4da3ff;font-weight:600}
  .linkbtn[hidden]{display:none}
  .cast{display:flex;gap:12px;overflow-x:auto;margin-top:16px}
  .cast:empty{display:none}
  .cast div{flex:none;width:72px;text-align:center;font-size:11px;line-height:1.2}
  .cast div.go{cursor:pointer}
  .cast img{width:60px;height:60px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 5px;background:var(--panel)}
  .cast em{display:block;font-style:normal;color:var(--mut);font-size:10px;margin-top:2px}
  .sec{margin:24px 0 0;font-size:15px;font-weight:700}
  .sgrow{display:flex;gap:10px;overflow-x:auto;margin-top:10px}
  .sgi{flex:none;width:92px;cursor:pointer}
  .prog{margin-top:18px;background:var(--panel);border-radius:12px;padding:12px 14px}
  .pbar{height:6px;border-radius:3px;background:#2a2a36;overflow:hidden}
  .pbar i{display:block;height:100%;background:#3b8cff;width:0}
  .prow{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px;font-size:18px}
  .prow button{width:44px;height:40px;padding:0;font-size:20px;background:#23232e}
  .prow .lnk{background:none;padding:0;font-size:18px;width:auto;height:auto;text-decoration:underline dotted;color:var(--fg)}

  /* episodi */
  .ep{background:var(--panel);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .still{aspect-ratio:16/9;background:#000}
  .still img{width:100%;height:100%;object-fit:cover;display:block}
  .ep .et{padding:10px 12px 0;font-weight:700}
  .ep .eo{padding:6px 12px 12px;color:#c9c9d3;line-height:1.45;font-size:14px}
  .ep .et:last-child{padding-bottom:12px}

  /* attore */
  .ahd{display:flex;align-items:center;gap:14px;padding:6px 0 4px}
  .ahd img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--panel)}
  .anm{font-size:20px;font-weight:700}

  /* trailer e zoom */
  #trailer{background:#000}
  .tbox{width:min(100%,calc((100vh - 120px)*16/9));aspect-ratio:16/9;margin:0 auto;background:#111}
  .tbox iframe{width:100%;height:100%;border:0;display:block}
  .tyt{display:block;text-align:center;color:#4da3ff;padding:16px;font-weight:600}
  #zoom{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center}
  #zoom.on{display:flex}
  #zoom img{max-width:94vw;max-height:92vh;object-fit:contain;border-radius:8px}

  /* scelta lista */
  #pick{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
  #pick.on{display:flex}
  .pickbox{background:var(--panel);width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:8px}
  .pickbox h3{margin:0 0 6px;font-size:15px}
  .pickbox button{background:#23232e;padding:14px}
</style>
</head>
<body>
<header id="hd">
  <div class="mrow" id="mrow"></div>
  <div class="hrow">
    <button class="ddb" id="ddTv" data-c="tv"></button>
    <span class="sp"></span>
    <button id="bSort"></button>
    <button id="bSet">⚙</button>
  </div>
  <div class="hrow">
    <button class="ddb" id="ddMovie" data-c="movie"></button>
    <span class="sp"></span>
    <button id="bAdd" class="p">+ Aggiungi</button>
  </div>
  <div class="menu" id="menu"></div>
</header>
<div id="grid"></div>

<!-- ricerca -->
<div class="sheet" id="search">
  <div class="bar">
    <button id="sClose">✕</button>
    <input id="q" type="search" placeholder="Cerca su TMDB…" enterkeyhint="search">
    <button id="sGo" class="p">Cerca</button>
  </div>
  <div class="body"><div id="res" class="res"></div><div id="sMsg" class="msg"></div></div>
</div>

<!-- scheda -->
<div class="sheet" id="detail">
  <button class="fab" id="dClose">←</button>
  <button class="fab home" id="dHome" aria-label="Home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <div class="body">
    <div class="hero" id="dHero"><i></i></div>
    <div class="head">
      <div class="c" id="dPoster"><img id="dImg" alt=""></div>
      <div class="info">
        <div class="vote" id="dVote" hidden><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="22" fill="#081c22"/><circle cx="23" cy="23" r="18" fill="none" stroke-width="3.5" id="vTr"/><circle cx="23" cy="23" r="18" fill="none" stroke-width="3.5" stroke-linecap="round" transform="rotate(-90 23 23)" id="vRg"/></svg><b><span id="vNum"></span><small>%</small></b></div>
        <h2 id="dTitle"></h2>
        <div class="sub" id="dSub"></div>
        <div class="links">
          <button class="linkbtn" id="dEps">Episodi ›</button>
          <button class="linkbtn" id="dTr" hidden>Trailer ›</button>
        </div>
      </div>
    </div>
    <div class="pad">
      <button id="dAdd" class="p" hidden style="width:100%;margin:26px 0 4px">Aggiungi a…</button>
      <div class="genrow" id="dGenRow"><div class="gen" id="dGen"></div><button class="trb" id="dTrP" hidden>Traduci</button></div>
      <div class="prog" id="dProg" hidden>
        <div class="pbar"><i id="pFill"></i></div>
        <div class="prow"><button id="pMinus">−</button><span><span id="pCur">0</span> / <button class="lnk" id="pTot">?</button></span><button id="pPlus">+</button></div>
      </div>
      <p id="dPlot"></p>
      <div id="dCast" class="cast"></div>
      <div class="csrow"><button id="dCs">Cerca in CloudStream</button><div class="msg" id="dCsMsg" style="padding:8px 0 0" hidden></div></div>
      <div id="dSugg" hidden>
        <div class="sec">Suggeriti</div>
        <div class="sgrow" id="dSgRow"></div>
      </div>
      <div id="dEdit">
        <div class="row" id="dMove" style="margin-top:22px"></div>
        <label>Poster personalizzato (URL immagine)</label>
        <div class="row"><input id="dUrl" style="flex:1" placeholder="https://…"><button id="dUrlOk">Usa</button></div>
        <div class="row">
          <button id="dFile">Carica dalla galleria</button>
          <button id="dPic">Poster Pictorium</button>
          <button id="dTmdb">Altri poster TMDB</button>
          <button id="dReset">Poster originale</button>
        </div>
        <input id="file" type="file" accept="image/*" hidden>
        <div id="alts" class="res" style="margin-top:12px"></div>
        <div class="row" style="margin-top:24px"><button id="dDel" style="color:var(--acc)">Rimuovi dalla lista</button></div>
      </div>
    </div>
  </div>
</div>

<!-- episodi -->
<div class="sheet" id="eps">
  <div class="bar">
    <button id="eClose">←</button>
    <strong id="eTitle" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></strong>
    <select id="eSeason" hidden></select>
  </div>
  <div class="body" id="eList"></div>
</div>

<!-- filmografia -->
<div class="sheet" id="actor">
  <div class="bar">
    <button id="aClose">←</button>
    <strong id="aTitle" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></strong>
    <button id="aHome" class="hm" aria-label="Home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
  </div>
  <div class="body" id="aBody"></div>
</div>

<!-- trailer -->
<div class="sheet" id="trailer">
  <div class="bar"><button id="tClose">✕</button></div>
  <div class="body" style="display:flex;flex-direction:column;justify-content:center;padding:0 0 24px">
    <div class="tbox" id="tBox"></div>
    <a class="tyt" id="tYt" target="_blank" rel="noopener">Apri su YouTube</a>
  </div>
</div>

<!-- liste MDBList -->
<div class="sheet" id="mlist">
  <div class="bar">
    <button id="mClose">←</button>
    <strong id="mTitle" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></strong>
    <button id="mRef" class="hm" aria-label="Aggiorna" style="font-size:18px">↻</button>
    <button id="mHome" class="hm" aria-label="Home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
  </div>
  <div class="body"><div id="mGrid" class="pg"></div><div id="mMsg" class="msg"></div><button id="mMore" class="mlbtn" hidden>Carica altri</button></div>
</div>

<!-- impostazioni -->
<div class="sheet" id="settings">
  <div class="bar"><button id="stClose">✕ Chiudi</button></div>
  <div class="body">
    <div class="sh first">Statistiche</div>
    <div class="stats">
      <div class="sc"><h4>SERIE</h4><div class="big" id="stTvT">–</div><div class="lab">Completate</div><div class="sm" id="stTvN"></div></div>
      <div class="sc"><h4>FILM</h4><div class="big" id="stMvT">–</div><div class="lab">Completati</div><div class="sm" id="stMvN"></div></div>
    </div>
    <div class="row"><button id="stUpd">Aggiorna statistiche</button></div>
    <div id="stMsg" class="msg" style="padding:10px 0 0"></div>

    <div class="sh">Integrazioni</div>
    <label>Chiave API TMDB (v3) oppure Read Access Token (v4)</label>
    <input id="kTmdb" style="width:100%" autocomplete="off">
    <label>Link Pictorium (modello con {type}, {tmdb_id|imdb_id}, {shape})</label>
    <input id="kPic" style="width:100%" autocomplete="off">
    <label>Shape Pictorium</label>
    <input id="kShape" style="width:100%" autocomplete="off" placeholder="es. poster">
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="kAuto"> Usa Pictorium per le nuove serie</label>
    <label>Tipo Pictorium per i film</label>
    <input id="kPicMt" style="width:100%" autocomplete="off" placeholder="movie">
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="kAutoMovie"> Usa Pictorium per i nuovi film</label>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="kPicAll"> Usa Pictorium anche per i titoli che non ho in lista</label>
    <label>Chiave API MDBList</label>
    <input id="kMdb" style="width:100%" autocomplete="off">
    <label>Liste dei tasti in alto (nome e link MDBList)</label>
    <div id="mlRows"></div>

    <div class="sh">Aspetto</div>
    <label>Locandine per riga in orizzontale</label>
    <select id="kCols"><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>

    <div class="sh">Aggiornamento</div>
    <div class="row"><button id="fixT">Aggiorna titoli in inglese</button></div>
    <div id="fixMsg" class="msg" style="padding:10px 0 0"></div>
    <div class="row"><button id="fixM">Scarica generi e dettagli di tutti</button></div>
    <div id="fixMMsg" class="msg" style="padding:10px 0 0"></div>
    <div class="row"><button id="fixV">Aggiorna voti</button></div>
    <div id="fixVMsg" class="msg" style="padding:10px 0 0"></div>

    <div class="sh">Backup</div>
    <div class="row">
      <button id="exp">Esporta backup</button>
      <button id="imp">Importa backup</button>
      <input id="impf" type="file" accept="application/json" hidden>
    </div>
    <p class="msg">I dati restano solo su questo telefono.</p>
    <p class="credit">K-LIST® an easy catalog created by Aisaka82, powered by Claude IA</p>
  </div>
  <div class="savebar"><button id="stSave" class="p">Salva</button></div>
</div>

<!-- scelta lista all'aggiunta -->
<div id="pick"><div class="pickbox">
  <h3 id="pickT">Aggiungi a…</h3>
  <div id="pickBtns" style="display:flex;flex-direction:column;gap:8px"></div>
  <button id="pickX" style="background:none;color:var(--mut)">Annulla</button>
</div></div>

<!-- locandina ingrandita -->
<div id="zoom"><img id="zImg" alt=""></div>

<script>
const $=s=>document.querySelector(s);
const IMG='https://image.tmdb.org/t/p/';
const CAT={tv:'Serie',movie:'Film'};
const LISTS={
  tv:{viste:'Completate',vedere:'Da vedere',guardando:'Guardando',abbandonate:'Abbandonate'},
  movie:{visti:'Completati',vedere:'Da vedere'}
};
const DEF={tv:'viste',movie:'visti'};
const SORTS=[['recent','Recenti','Recenti'],['az','A–Z','A–Z'],['za','Z–A','Z–A'],['yd','Anno ↓','Anno · più recenti prima'],['ya','Anno ↑','Anno · più vecchi prima'],['vd','Voto ↓','Voto · più alti prima'],['va','Voto ↑','Voto · più bassi prima']];
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'')||d}catch(e){return d}};
const ty=s=>s.type==='movie'?'movie':'tv';
function norm(s){
  s.type=ty(s);
  if(!LISTS[s.type][s.list])s.list=DEF[s.type];
}
let db=jget('serie',[]);
db.forEach(norm);
let cfg=jget('cfg',{});
let epc=jget('eps',{});
let sg=jget('sg',{});
let ac=jget('ac',{order:[],data:{}});
let cur=null,pending=null,searchCat=null,menuKind=null;
let sort=localStorage.getItem('sort')||'recent';
if(!SORTS.some(x=>x[0]===sort))sort='recent';
let cat=localStorage.getItem('cat');if(!CAT[cat])cat='tv';
let views=jget('views',{});
(function(){
  const old=localStorage.getItem('view'); /* vecchia versione: solo serie */
  if(!views.tv&&old)views.tv=old;
  Object.keys(CAT).forEach(c=>{if(!LISTS[c][views[c]])views[c]=DEF[c]});
})();
const saveView=()=>{localStorage.setItem('cat',cat);localStorage.setItem('views',JSON.stringify(views))};
const loading=new Set();
const dstack=[];          /* storia delle schede aperte una sopra l'altra */
const inDb=s=>db.includes(s);
const findDb=(t,id)=>db.find(s=>ty(s)===t&&s.id===id);
const isDone=(t,id)=>{const x=findDb(t,id);return !!x&&x.list===DEF[t]};   /* la spunta verde: solo se e' nei completati */
const astack=[];          /* storia delle filmografie aperte una sopra l'altra */
let homing=false;

/* ---------- traduzione (solo testi inglesi -> italiano) ---------- */
let trc=jget('trc',{});
const trOn=new Set();
const saveTrc=()=>{try{localStorage.setItem('trc',JSON.stringify(trc))}catch(e){}};
const EN_W=new Set('the and of to is was that with for his her he she they their this but not are from by on as be at an or you your have has had who what when will would after while into about out over'.split(' '));
const IT_W=new Set('il lo la le gli di del della dei che e è un una per con non sono come ma si da nel nella al alla suo sua loro anche quando dove cui più dopo mentre'.split(' '));
function isEn(t){
  const w=(t||'').toLowerCase().match(/[a-zàèéìòù']+/g)||[];
  if(w.length<4)return false;
  let e=0,i=0;w.forEach(x=>{if(EN_W.has(x))e++;if(IT_W.has(x))i++});
  return e>=1&&e>i;
}
async function translate(text){
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=it&dt=t&q='+encodeURIComponent(text));
    if(!r.ok)throw 0;
    const j=await r.json();
    const out=(j[0]||[]).map(x=>x[0]||'').join('');
    if(out)return out;
  }catch(e){}
  try{
    const parts=text.match(/[^.!?]+[.!?]*\s*/g)||[text],chunks=[];let c='';
    parts.forEach(p=>{if((c+p).length>450&&c){chunks.push(c);c=''}c+=p});
    if(c)chunks.push(c);
    const outs=[];
    for(const q of chunks){
      const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|it&q='+encodeURIComponent(q));
      const j=await r.json();
      if(!j.responseData||j.responseStatus!=200)throw 0;
      outs.push(j.responseData.translatedText);
    }
    const o=outs.join(' ').trim();
    if(o)return o;
  }catch(e){}
  throw new Error('Traduzione non disponibile ora. Riprova più tardi.');
}

/* ---------- tasto/gesto indietro: chiude solo l'ultima schermata aperta ---------- */
const stack=[];
const LAY={search:'#search',detail:'#detail',eps:'#eps',actor:'#actor',trailer:'#trailer',settings:'#settings',mlist:'#mlist',pick:'#pick',menu:'#menu',zoom:'#zoom'};
function zfix(){
  Object.keys(LAY).forEach(n=>{
    const i=stack.lastIndexOf(n);
    $(LAY[n]).style.zIndex=i<0?'':String(10+i*2);
  });
}
function openLayer(n,dup){
  if(!dup&&stack.includes(n))return;
  $(LAY[n]).classList.add('on');
  stack.push(n);
  zfix();
  try{history.pushState({l:n},'')}catch(e){}
}
function closeLayer(n){
  if(!stack.includes(n))return;
  if(stack[stack.length-1]===n){history.back();return}
  stack.splice(stack.lastIndexOf(n),1);
  if(!stack.includes(n))$(LAY[n]).classList.remove('on');
  zfix();
}
window.addEventListener('popstate',()=>{
  const n=stack.pop();
  if(!n)return;
  if(n==='pick')pending=null;
  if(n==='trailer')$('#tBox').innerHTML='';
  if(n==='settings'&&settingsDirty()&&confirm('Salvare le modifiche alle impostazioni?'))saveSettings();
  if(n==='actor'){
    astack.pop();
    if(astack.length){
      const e=astack[astack.length-1];
      renderActor(e.a).then(()=>{$('#aBody').scrollTop=e.y});
    }
  }
  if(n==='detail'){
    dstack.pop();
    if(dstack.length){
      const e=dstack[dstack.length-1];
      cur=e.s;renderDetail();$('#detail .body').scrollTop=e.y;
    }else cur=null;
  }
  if(!stack.includes(n))$(LAY[n]).classList.remove('on');
  zfix();
  if(homing){if(stack.length)history.back();else homing=false}
});
function goHome(){
  if(!stack.length)return;
  homing=true;history.back();
}

const poster=(s,w='w342')=>{
  if(s.custom)return s.custom;
  if(!inDb(s)&&picOn()){const u=picUrl(s);if(u)return u}   /* titolo non in lista: locandina Pictorium */

let pc=jget('pc',{});
async function tmdbPath(t,id){
  const k=t+id;
  if(pc[k]!==undefined)return pc[k];
  try{
    const d=await tmdb(`/${t}/${id}`,{language:'en-US'});
    pc[k]=d.poster_path||'';
    try{localStorage.setItem('pc',JSON.stringify(pc))}catch(e){}
    return pc[k];
  }catch(e){return ''}
}
/* immagine di un titolo che compare in una griglia: Pictorium se non e' in lista, altrimenti la tua; se fallisce, TMDB */
function fillImg(img,t,id,path,w){
  const x=findDb(t,id);
  let src;
  if(x)src=poster(x,w);
  else{
    const pu=picOn()?picUrl({type:t,id}):'';
    src=pu||(path?IMG+w+path:'');
  }
  const fb=async()=>{
    img.onerror=null;
    const p=path||(x&&x.path)||await tmdbPath(t,id);
    if(p)img.src=IMG+w+p;
  };
  img.onerror=fb;
  if(src)img.src=src;else fb();
}

function runtimeText(m){

const yearOf=s=>{const y=parseInt(s.year,10);return y>=1900?y:0};

/* ---------- lista ---------- */
function render(){
  const inList=db.filter(s=>ty(s)===cat&&s.list===views[cat]);
  Object.keys(CAT).forEach(c=>{
    const b=$(c==='tv'?'#ddTv':'#ddMovie');
    b.textContent=`${CAT[c]} · ${LISTS[c][views[c]]} (${count(c,views[c])}) ▾`;
    b.classList.toggle('act',c===cat);
  });
  $('#bSort').textContent=SORTS.find(x=>x[0]===sort)[1]+' ▾';
  const g=$('#grid');g.innerHTML='';
  if(!inList.length){
    const e=document.createElement('div');e.id='empty';
    e.innerHTML=db.length?(cat==='tv'?'Nessuna serie in questa lista.':'Nessun film in questa lista.'):'Nessuna serie.<br>Premi “+ Aggiungi” per iniziare.<br><br>Prima inserisci la chiave TMDB in ⚙';
    g.appendChild(e);
  }
  let list=inList;
  const grouped=sort==='yd'||sort==='ya';
  if(sort==='az')list=[...inList].sort(cmpName);
  else if(sort==='za')list=[...inList].sort((a,b)=>cmpName(b,a));
  else if(sort==='vd'||sort==='va'){
    const desc=sort==='vd';
    list=[...inList].sort((a,b)=>{
      const va=voteOf(a),vb=voteOf(b);
      if(!va&&vb)return 1;
      if(va&&!vb)return -1;
      if(va!==vb)return desc?vb-va:va-vb;
      return cmpName(a,b);
    });
  }
  else if(grouped){
    const desc=sort==='yd';
    list=[...inList].sort((a,b)=>{
      const ya=yearOf(a),yb=yearOf(b);
      if(!ya&&yb)return 1;
      if(ya&&!yb)return -1;
      if(ya!==yb)return desc?yb-ya:ya-yb;
      return cmpName(a,b);
    });
  }
  const cnt={};
  if(grouped)list.forEach(s=>{const y=yearOf(s);cnt[y]=(cnt[y]||0)+1});
  let lastY=null;
  list.forEach(s=>{
    if(grouped){
      const y=yearOf(s);
      if(y!==lastY){
        lastY=y;
        const h=document.createElement('div');h.className='yh';
        h.textContent=`${y||'Senza anno'} (${cnt[y]})`;
        g.appendChild(h);
      }
    }
    const d=document.createElement('div');d.className='it';
    const c=document.createElement('div');c.className='c';
    if(poster(s)){const im=document.createElement('img');im.loading='lazy';im.src=poster(s);c.appendChild(im)}
    const t=document.createElement('div');t.className='t';t.textContent=s.name;
    d.append(c,t);
    d.onclick=()=>openDetail(s);
    g.appendChild(d);
  });
}

/* ---------- TMDB ---------- */
async function tmdb(path,params={}){
  const k=(cfg.tmdb||'').trim();
  if(!k) throw new Error('Inserisci la chiave TMDB in ⚙');
  const u=new URL('https://api.themoviedb.org/3'+path);
  Object.entries(params).forEach(([a,b])=>u.searchParams.set(a,b));
  const o={};
  if(k.length>40) o.headers={Authorization:'Bearer '+k}; else u.searchParams.set('api_key',k);
  const r=await fetch(u,o);
  if(!r.ok) throw new Error('Errore TMDB '+r.status+(r.status==401?' (chiave non valida)':''));
  return r.json();
}

function pickTrailer(vs){
  const y=(vs||[]).filter(v=>v.site==='YouTube'&&v.key&&(v.type==='Trailer'||v.type==='Teaser'));
  const rank=v=>(v.type==='Trailer'?0:2)+(v.official?0:1);
  y.sort((a,b)=>rank(a)-rank(b)||String(b.published_at).localeCompare(String(a.published_at)));
  return y[0]?y[0].key:'';
}
async function fetchMeta(s){
  const T=ty(s);
  const [d,it,cr,vd]=await Promise.all([
    tmdb(`/${T}/${s.id}`,{language:'en-US'}),
    s.overview===undefined?tmdb(`/${T}/${s.id}`,{language:'it-IT'}):Promise.resolve(null),
    tmdb(`/${T}/${s.id}/credits`,{language:'en-US'}).catch(()=>null),
    tmdb(`/${T}/${s.id}/videos`,{language:'en-US',include_video_language:'en,ko'}).catch(()=>null)
  ]);
  if(s.overview===undefined) s.overview=(it&&it.overview)||d.overview||'';
  if(!s.name) s.name=d.name||d.title||'';
  if(!s.year) s.year=(d.first_air_date||d.release_date||'').slice(0,4);
  s.backdrop=d.backdrop_path||'';
  if(!s.path&&d.poster_path)s.path=d.poster_path;
  s.va=d.vote_average||0;s.vc=d.vote_count||0;
  s.genres=(d.genres||[]).map(g=>g.name);
  s.gi=(d.genres||[]).map(g=>g.id);
  if(T==='tv'){
    s.ert=(d.episode_run_time&&d.episode_run_time[0])||(d.last_episode_to_air&&d.last_episode_to_air.runtime)||0;
    s.eps=d.number_of_episodes||0;
    s.seasons=(d.seasons||[]).filter(x=>x.season_number>0&&x.episode_count>0).map(x=>({n:x.season_number,c:x.episode_count}));
  }else{
    s.runtime=d.runtime||0;
  }
  if(cr) s.cast=(cr.cast||[]).filter(a=>a.profile_path).slice(0,8).map(a=>({id:a.id,n:a.name,p:a.profile_path,c:a.character||''}));
  if(vd) s.tr=pickTrailer(vd.results);
  s.v=3;
}
async function loadMeta(s){
  loading.add(s);renderDetailIf(s);
  try{
    await fetchMeta(s);
    if(inDb(s))save();
  }catch(e){
    if(cur===s&&!s.overview) $('#dPlot').textContent='Trama non disponibile ('+e.message+')';
  }
  loading.delete(s);renderDetailIf(s);
  if(s.v===3)loadSugg(s);
  if(s.v===3&&ty(s)==='tv'&&inDb(s)&&s.ms!==1)calcMin(s).then(()=>save()).catch(()=>{});
}
/* durata totale di una serie: somma delle durate di tutti gli episodi (per le statistiche) */
async function calcMin(s){
  if(s.ert===undefined){
    const d=await tmdb(`/tv/${s.id}`,{language:'en-US'});
    s.ert=(d.episode_run_time&&d.episode_run_time[0])||(d.last_episode_to_air&&d.last_episode_to_air.runtime)||0;
  }
  let sum=0,known=0,cnt=0;
  for(const x of (s.seasons||[])){
    const j=await tmdb(`/tv/${s.id}/season/${x.n}`,{language:'en-US'});
    (j.episodes||[]).forEach(e=>{cnt++;if(e.runtime>0){sum+=e.runtime;known++}});
  }
  if(!cnt)s.m=(s.ert||0)*total(s);
  else{
    const avg=known?sum/known:(s.ert||0);
    s.m=Math.round(sum+(cnt-known)*avg);
  }
  s.mok=s.m>0;s.ms=1;
}

/* ---------- suggeriti (solo coreani) ---------- */
const sgKey=s=>ty(s)+'_'+s.id;
async function fetchSugg(s){
  const T=ty(s),seen=new Set([s.id]),out=[];
  let ok=false;
  const add=r=>{
    if(r.original_language==='ko'&&r.poster_path&&!seen.has(r.id)){
      seen.add(r.id);
      out.push({id:r.id,n:r.name||r.title||'',y:(r.first_air_date||r.release_date||'').slice(0,4),p:r.poster_path});
    }
  };
  for(const pg of [1,2]){
    try{
      const j=await tmdb(`/${T}/${s.id}/recommendations`,{language:'en-US',page:pg});
      ok=true;(j.results||[]).forEach(add);
      if((j.total_pages||1)<=pg)break;
    }catch(e){break}
  }
  if(out.length<10){
    const p={language:'en-US',with_original_language:'ko',sort_by:'popularity.desc','vote_count.gte':50,page:1};
    const g=(s.gi||[]).slice(0,2).join('|');
    if(g)p.with_genres=g;
    try{
      const j=await tmdb(`/discover/${T}`,p);
      ok=true;(j.results||[]).forEach(r=>{if(out.length<12)add(r)});
    }catch(e){}
  }
  return ok?out.slice(0,12):null;
}
async function loadSugg(s){
  if(!inDb(s)){renderSugg();return}
  const k=sgKey(s);
  if(!sg[k]){
    const r=await fetchSugg(s);
    if(!r)return;
    sg[k]=r;
    try{localStorage.setItem('sg',JSON.stringify(sg))}catch(e){}
  }
  if(cur===s)renderSugg();
}
function renderSugg(){
  const s=cur,box=$('#dSugg');
  if(!s||!inDb(s)||!(sg[sgKey(s)]||[]).length){box.hidden=true;return}
  box.hidden=false;
  const row=$('#dSgRow');row.innerHTML='';
  sg[sgKey(s)].forEach(x=>{
    const t=ty(s);
    const d=document.createElement('div');d.className='sgi';
    const c=document.createElement('div');c.className='c';
    const im=document.createElement('img');im.loading='lazy';fillImg(im,t,x.id,x.p,'w185');c.appendChild(im);
    if(isDone(t,x.id)){const k=document.createElement('i');k.className='ck';k.textContent='✓';c.appendChild(k)}

/* ---------- filmografia di un attore ---------- */
const SKIP_G=[10767,10764,10763]; /* talk show, reality, notizie */
let actorToken=0;
async function getFilmo(id){
  if(ac.data[id])return ac.data[id];
  const j=await tmdb(`/person/${id}/combined_credits`,{language:'en-US'});
  const seen=new Set(),out=[];
  (j.cast||[]).forEach(r=>{
    const t=r.media_type;
    if(t!=='tv'&&t!=='movie')return;
    if((r.genre_ids||[]).some(g=>SKIP_G.includes(g)))return;
    const k=t+r.id;if(seen.has(k))return;seen.add(k);
    const d=r.first_air_date||r.release_date||'';
    out.push({t,id:r.id,n:r.name||r.title||'',y:d.slice(0,4),d,p:r.poster_path||''});
  });
  out.sort((a,b)=>(!a.d&&b.d)?1:(a.d&&!b.d)?-1:b.d.localeCompare(a.d));
  ac.data[id]=out;ac.order=ac.order.filter(x=>x!==id);ac.order.push(id);
  while(ac.order.length>15)delete ac.data[ac.order.shift()];
  try{localStorage.setItem('ac',JSON.stringify(ac))}catch(e){}
  return out;
}
function openActor(a){
  if(astack.length&&stack.includes('actor'))astack[astack.length-1].y=$('#aBody').scrollTop;
  astack.push({a,y:0});
  renderActor(a);
  openLayer('actor',true);
  $('#aBody').scrollTop=0;
}

  const tok=++actorToken;
  $('#aTitle').textContent=a.n;
  const B=$('#aBody');B.innerHTML='';
  const hd=document.createElement('div');hd.className='ahd';
  const im=document.createElement('img');im.src=IMG+'w185'+a.p;
  const nm=document.createElement('div');nm.className='anm';nm.textContent=a.n;
  hd.append(im,nm);B.appendChild(hd);
  const st=document.createElement('div');st.className='msg';st.textContent='Carico…';B.appendChild(st);
  try{
    const list=await getFilmo(a.id);
    if(tok!==actorToken)return;
    st.remove();
    if(!list.length){const m=document.createElement('div');m.className='msg';m.textContent='Nessun titolo trovato.';B.appendChild(m);return}
    [['tv','Serie'],['movie','Film']].forEach(([t,lab])=>{
      const items=list.filter(x=>x.t===t);
      if(!items.length)return;
      const h=document.createElement('div');h.className='sec';h.textContent=`${lab} (${items.length})`;
      h.style.margin='20px 0 10px';
      const g=document.createElement('div');g.className='pg';
      items.forEach(x=>{
        const d=document.createElement('div');d.className='it';
        const c=document.createElement('div');c.className='c';
        {const i=document.createElement('img');i.loading='lazy';fillImg(i,x.t,x.id,x.p,'w185');c.appendChild(i)}
        if(isDone(x.t,x.id)){const k=document.createElement('i');k.className='ck';k.textContent='✓';c.appendChild(k)}
        const n=document.createElement('div');n.className='t';n.textContent=x.n;
        const y=document.createElement('div');y.className='y';y.textContent=x.y;
        d.append(c,n,y);
        d.onclick=()=>openItem(x.t,x.id,x.n,x.y,x.p);
        g.appendChild(d);
      });
      B.append(h,g);
    });
  }catch(e){if(tok===actorToken)st.textContent=e.message}

async function showSeason(s,n){
  const L=$('#eList');
  const key=s.id+'_'+n;
  if(!epc[key]){
    L.innerHTML='<div class="msg">Carico…</div>';
    try{
      const j=await tmdb(`/tv/${s.id}/season/${n}`,{language:'en-US'});
      epc[key]=(j.episodes||[]).map(e=>({e:e.episode_number,t:e.name||'',o:e.overview||'',i:e.still_path||''}));
      saveEps();
    }catch(err){L.innerHTML='';const m=document.createElement('div');m.className='msg';m.textContent=err.message;L.appendChild(m);return}
  }
  if(cur!==s||+$('#eSeason').value!==n&&!$('#eSeason').hidden)return;
  L.innerHTML='';
  if(!epc[key].length){L.innerHTML='<div class="msg">Nessun episodio disponibile.</div>';return}
  epc[key].forEach(e=>{
    const d=document.createElement('div');d.className='ep';
    const st=document.createElement('div');st.className='still';
    if(e.i){const im=document.createElement('img');im.loading='lazy';im.src=IMG+'w300'+e.i;st.appendChild(im)}
    const t=document.createElement('div');t.className='et';
    const tt=document.createElement('span');
    const tb=document.createElement('button');tb.className='trb';tb.hidden=true;
    t.append(tt,tb);
    d.append(st,t);
    let o=null;
    if(e.o){o=document.createElement('div');o.className='eo';d.appendChild(o)}
    const k=`e${s.id}_${n}_${e.e}`;
    const paint=()=>{
      const on=trOn.has(k)&&!!trc[k];
      tt.textContent=`E${e.e} · ${on?(trc[k].t||e.t):(e.t||'Episode '+e.e)}`;
      if(o)o.textContent=on?trc[k].o:e.o;
      tb.hidden=!(e.o&&(on||isEn(e.o)));
      tb.disabled=false;tb.textContent=on?'Originale':'Traduci';
    };
    tb.onclick=async()=>{
      if(trOn.has(k)){trOn.delete(k);paint();return}
      if(!trc[k]){
        tb.disabled=true;tb.textContent='…';
        try{
          const [to,tt2]=await Promise.all([translate(e.o),e.t?translate(e.t):Promise.resolve('')]);
          trc[k]={o:to,t:tt2};saveTrc();
        }catch(err){alert(err.message);paint();return}
      }
      trOn.add(k);paint();
    };
    paint();
    L.appendChild(d);
  });
  L.scrollTop=0;
}

/* ---------- liste MDBList ---------- */
let ml=jget('ml',{});
const ML_LIM=40;
let mlCur=null,mlTok=0;
function renderMl(){
  const row=$('#mrow');row.innerHTML='';
  mlCfg().forEach((L,i)=>{
    const b=document.createElement('button');b.textContent=L.n;
    b.onclick=()=>openMl(i);
    row.appendChild(b);
  });
}
function mlPath(u){
  u=(u||'').trim().replace(/[?#].*$/,'').replace(/\/+$/,'');
  const m=u.match(/lists\/([^\/]+)\/([^\/]+)(?:\/[a-z]+)?$/i);
  if(m)return m[1]+'/'+m[2];
  return u.replace(/^https?:\/\/[^\/]+\//,'');
}
async function mdbFetch(path,off){
  const key=(cfg.mdb||'').trim();
  let r;
  try{r=await fetch(`https://api.mdblist.com/lists/${path}/items?apikey=${encodeURIComponent(key)}&limit=${ML_LIM}&offset=${off}`)}
  catch(e){throw new Error('Impossibile raggiungere MDBList (rete assente o richiesta bloccata dal browser).')}
  if(!r.ok)throw new Error('Errore MDBList '+r.status+(r.status===401||r.status===403?' (chiave non valida)':r.status===404?' (lista non trovata, controlla il link)':''));
  const j=await r.json();
  let arr;
  if(Array.isArray(j))arr=j;
  else arr=[...(j.movies||[]).map(x=>({...x,mediatype:x.mediatype||'movie'})),...(j.shows||[]).map(x=>({...x,mediatype:x.mediatype||'show'}))].sort((a,b)=>(a.rank||0)-(b.rank||0));
  const items=[];
  arr.forEach(x=>{
    const id=x.tmdb_id||x.id;if(!id)return;
    items.push({t:x.mediatype==='movie'?'movie':'tv',id,n:x.title||x.name||'',y:String(x.release_year||x.year||'')});
  });
  return {items,more:arr.length>=ML_LIM};
}
function openMl(i){
  const L=mlCfg()[i];
  if(!(cfg.mdb||'').trim()){alert('Inserisci la chiave MDBList in ⚙ → Integrazioni');return}
  if(!L.u){alert('Imposta il link di questa lista in ⚙ → Integrazioni');return}
  $('#mTitle').textContent=L.n;
  $('#mGrid').innerHTML='';$('#mMsg').textContent='Carico…';$('#mMore').hidden=true;
  mlCur={path:mlPath(L.u),items:[],more:false,tok:++mlTok};
  openLayer('mlist');
  $('#mlist .body').scrollTop=0;
  loadMl(false);
}
async function loadMl(force){
  const c=mlCur,tok=c.tok;
  if(!c.items.length&&!force&&ml[c.path]&&Date.now()-ml[c.path].t<6*3600e3){
    c.items=ml[c.path].items.slice();c.more=ml[c.path].more;drawMl();return;
  }
  $('#mMore').disabled=true;
  try{
    const r=await mdbFetch(c.path,c.items.length);
    if(tok!==mlTok)return;
    const seen=new Set(c.items.map(x=>x.t+x.id));
    r.items.forEach(x=>{if(!seen.has(x.t+x.id)){seen.add(x.t+x.id);c.items.push(x)}});
    c.more=r.more;
    if(c.items.length<=ML_LIM){ml[c.path]={t:Date.now(),items:c.items.slice(),more:c.more};try{localStorage.setItem('ml',JSON.stringify(ml))}catch(e){}}
    drawMl();
  }catch(e){
    if(tok!==mlTok)return;
    $('#mMsg').textContent=e.message;$('#mMore').disabled=false;
  }
}
function drawMl(){
  const c=mlCur,G=$('#mGrid');G.innerHTML='';
  c.items.forEach(x=>{
    const d=document.createElement('div');d.className='it';
    const cc=document.createElement('div');cc.className='c';
    const im=document.createElement('img');im.loading='lazy';fillImg(im,x.t,x.id,'','w185');cc.appendChild(im);
    if(isDone(x.t,x.id)){const k=document.createElement('i');k.className='ck';k.textContent='✓';cc.appendChild(k)}
    const n=document.createElement('div');n.className='t';n.textContent=x.n;
    const y=document.createElement('div');y.className='y';y.textContent=x.y;
    d.append(cc,n,y);
    d.onclick=()=>openItem(x.t,x.id,x.n,x.y,'');
    G.appendChild(d);
  });
  $('#mMsg').textContent=c.items.length?'':'Lista vuota.';
  $('#mMore').hidden=!c.more;$('#mMore').disabled=false;
}

function fmtT(m){
  const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60,p=[];
  if(d)p.push(d+'d');if(h)p.push(h+'h');if(mm||!p.length)p.push(mm+'m');
  return p.join(' ');
}
function calcStats(){
  const r={tv:{min:0,eps:0,n:0,pend:0,miss:0},movie:{min:0,n:0,pend:0,miss:0}};
  db.forEach(s=>{
    const t=ty(s);if(s.list!==DEF[t])return;
    const o=r[t];o.n++;
    if(t==='tv'){o.eps+=total(s);if(s.ms!==1)o.pend++;else if(!s.mok)o.miss++;o.min+=s.m||0}
    else{if(s.v!==3)o.pend++;else if(!s.runtime)o.miss++;o.min+=s.runtime||0}
  });
  return r;
}
function renderStats(note){
  const r=calcStats();
  $('#stTvT').textContent=fmtT(r.tv.min);
  $('#stTvN').textContent=`${r.tv.eps} episodi, ${r.tv.n} serie`;
  $('#stMvT').textContent=fmtT(r.movie.min);
  $('#stMvN').textContent=`${r.movie.n} film`;
  if(note!==undefined){$('#stMsg').textContent=note;return}
  const pend=r.tv.pend+r.movie.pend,miss=r.tv.miss+r.movie.miss,parts=[];
  if(pend)parts.push(`${pend} titoli ancora da calcolare: premi “Aggiorna statistiche”.`);
  if(miss)parts.push(`${miss} titoli senza durata su TMDB, esclusi dal tempo.`);
  $('#stMsg').textContent=parts.join(' ');
}
$('#stUpd').onclick=async()=>{
  const todo=db.filter(s=>s.list===DEF[ty(s)]&&(ty(s)==='tv'?s.ms!==1:s.v!==3));
  if(!todo.length){renderStats('Statistiche già aggiornate.');return}
  const tot=todo.length;let n=0,err=0,last='',stop=false;
  $('#stUpd').disabled=true;
  const worker=async()=>{
    while(todo.length&&!stop){
      const s=todo.shift();
      try{
        if(s.v!==3)await fetchMeta(s);
        if(ty(s)==='tv')await calcMin(s);
      }catch(e){err++;last=e.message;if(/chiave|401|Inserisci/.test(last))stop=true}
      renderStats(`Calcolo ${++n}/${tot}…`);
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  save();render();$('#stUpd').disabled=false;
  renderStats(err?`Finito, ${err} non calcolati (${last}). Riprova più tardi.`:'Statistiche aggiornate.');
};

    g.innerHTML=`<input id="mn${i}" style="width:100%" autocomplete="off" placeholder="${MLDEF[i]}"><input id="mu${i}" style="width:100%;margin-top:6px" autocomplete="off" placeholder="Link della lista su mdblist.com">`;
    box.appendChild(g);
    g.querySelector('#mn'+i).value=L.n;g.querySelector('#mu'+i).value=L.u;
  });
  renderStats();
  openLayer('settings');
  $('#settings .body').scrollTop=0;
};
$('#stClose').onclick=()=>closeLayer('settings');
$('#stSave').onclick=()=>{saveSettings();closeLayer('settings')};
$('#dHome').onclick=goHome;
$('#aHome').onclick=goHome;
$('#dTrP').onclick=async()=>{
  const s=cur,k='p'+ty(s)+s.id,b=$('#dTrP');
  if(trOn.has(k)){trOn.delete(k);renderDetail();return}
  if(!trc[k]){
    b.disabled=true;b.textContent='…';
    try{trc[k]=await translate(s.overview);saveTrc()}
    catch(e){alert(e.message);if(cur===s)renderDetail();return}
  }
  trOn.add(k);
  if(cur===s)renderDetail();
};
$('#fixT').onclick=async()=>{
  let i=0;
  try{
    for(const s of db){
      $('#fixMsg').textContent=`Aggiorno ${++i}/${db.length}…`;
      const j=await tmdb(`/${ty(s)}/${s.id}`,{language:'en-US'});
      const n=j.name||j.title;
      if(n) s.name=n;
    }
    save();render();$('#fixMsg').textContent='Titoli aggiornati.';
  }catch(e){save();render();$('#fixMsg').textContent=e.message}
};
$('#fixM').onclick=async()=>{
  const todo=db.filter(s=>s.v!==3||s.va===undefined);
  if(!todo.length){$('#fixMMsg').textContent='Tutti i titoli sono già aggiornati.';return}
  let i=0,err=0,last='';
  for(const s of todo){
    $('#fixMMsg').textContent=`Scarico ${++i}/${todo.length}…`;
    try{await fetchMeta(s)}catch(e){err++;last=e.message;if(/chiave|401|Inserisci/.test(last))break}
    if(i%10===0)save();
  }
  save();render();
  $('#fixMMsg').textContent=err?`Finito, ${err} non scaricati (${last}). Riprova più tardi.`:'Generi e dettagli scaricati.';
};
$('#fixV').onclick=async()=>{
  const todo=[...db],tot=todo.length;
  if(!tot){$('#fixVMsg').textContent='Nessun titolo in lista.';return}
  let n=0,err=0,last='',stop=false;
  $('#fixV').disabled=true;
  const worker=async()=>{
    while(todo.length&&!stop){
      const s=todo.shift();
      try{const d=await tmdb(`/${ty(s)}/${s.id}`,{language:'en-US'});s.va=d.vote_average||0;s.vc=d.vote_count||0}
      catch(e){err++;last=e.message;if(/chiave|401|Inserisci/.test(last))stop=true}
      $('#fixVMsg').textContent=`Aggiorno ${++n}/${tot}…`;
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  save();render();$('#fixV').disabled=false;
  if(cur)renderDetailIf(cur);
  $('#fixVMsg').textContent=err?`Finito, ${err} non aggiornati (${last}). Riprova più tardi.`:'Voti aggiornati.';
};
$('#exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));
  a.download='k-list-backup.json';a.click();
};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{
  try{
    const j=JSON.parse(await e.target.files[0].text());
    if(Array.isArray(j)){j.forEach(norm);db=j;save();render();alert('Importato')}
  }catch(_){alert('File non valido')}
};

applyCols();
renderMl();
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
