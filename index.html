  .xc{flex:none;width:min(40vw,190px);background:var(--panel);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
  .xc .c{border-radius:0;aspect-ratio:2/3}
  .xc .xi{padding:10px 10px 12px}
  .xc .xt{font-size:15px;font-weight:600;line-height:1.25;height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .xc .xm{font-size:12px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xc.all{display:flex;align-items:center;justify-content:center;aspect-ratio:auto;min-height:200px;color:var(--acc);font-weight:600}
  #dlg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:24px}
  #dlg.on{display:flex}
  .dlgbox{background:var(--panel);border-radius:16px;padding:20px;width:100%;max-width:340px}
  #dlgMsg{font-size:16px;line-height:1.4;margin-bottom:16px}
  #dlgIn{width:100%;margin-bottom:16px}
  #dlgIn[hidden]{display:none}
  .dlgbtns{display:flex;gap:8px;justify-content:flex-end}
  .dlgbtns button{padding:11px 18px}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:88vw;background:var(--p2);color:var(--fg);padding:12px 16px;border-radius:12px;z-index:80;display:none;font-size:14px;text-align:center;box-shadow:0 8px 24px #000a}
  #toast.on{display:block}
  #pick{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
  #pick.on{display:flex}
  #edt{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
  #edt.on{display:flex}
  #edt.kb{align-items:flex-start;padding-top:8px}
  #edt.kb .edtbox{padding-bottom:65vh;max-height:100vh}
  .edtbox{background:var(--panel);border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
  .edtbox .eh{display:flex;gap:12px;align-items:flex-start}
  .edtbox .eh .c{width:72px;flex:none}
  .edtbox .eh .ei{flex:1;min-width:0}
  .edtbox .el{font-size:12px;color:var(--mut);margin-bottom:-6px}
  .edtbox select{width:100%;background:var(--p2)}
  .edtbox textarea{width:100%;min-height:84px;resize:vertical;background:var(--p2);color:var(--fg);border:0;border-radius:12px;padding:12px;font:inherit;font-size:15px;box-sizing:border-box}
  .edtbox .ep{background:var(--p2);border-radius:12px;padding:10px}
  .edtbox .ep .pt{font-size:13px;display:flex;justify-content:space-between}
  .edtbox .ep .pbar{height:4px;margin-top:6px}
  .edtbox .ep .pbtn{display:flex;gap:6px;margin-top:8px}
  .edtbox .ep .pbtn button{flex:1;padding:0;height:34px;font-size:18px;background:var(--panel)}
  .edtbox .ep .sb{margin-top:8px;width:100%;background:var(--panel);padding:9px;font-size:13px}
  .edtbox .eact{display:flex;gap:8px}
  .edtbox .eact .p{flex:1}
  .edtbox .eact .del{flex:none;width:48px;background:var(--p2);color:#e5484d;display:grid;place-items:center;padding:0}
  .edtbox .eact .del[hidden]{display:none}
  .edtbox .eact .del svg{width:20px;height:20px}
  .pickbox{background:var(--panel);width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:8px}
  .pickbox h3{margin:0 0 6px;font-size:15px}
  .pickbox button{background:var(--p2);padding:14px}
</style>
</head>

const h2r=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const r2h=r=>'#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mixc=(a,b,k)=>{const A=h2r(a),B=h2r(b);return r2h(A.map((v,i)=>v+(B[i]-v)*k))};
const lumOf=h=>{const [r,g,b]=h2r(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const onCol=h=>lumOf(h)>0.4?'#10111a':'#ffffff';
function themeVals(){
  const nm=cfg.theme||'def';
  if(nm!=='custom')return THEMES[nm]||THEMES.def;
  const c=cfg.cust||{},bg=c.bg||THEMES.def.bg,dark=lumOf(bg)<0.4;
  const fg=c.text||(dark?'#ffffff':'#1a1b24'),pole=dark?'#ffffff':'#000000';
  return {bg,panel:mixc(bg,pole,.07),p2:mixc(bg,pole,.14),fg,mut:mixc(fg,bg,.45),sub:mixc(fg,bg,.2),line:mixc(bg,pole,.16),acc:c.acc||THEMES.def.acc,top:c.top||THEMES.def.top};
}
function applyTheme(){
  const T=themeVals(),st=document.documentElement.style;
  ['bg','panel','p2','fg','mut','sub','line','acc','top'].forEach(k=>st.setProperty('--'+k,T[k]));
  document.documentElement.dataset.light=lumOf(T.bg)>=0.4?'1':'0';
  st.setProperty('--onacc',onCol(T.acc));st.setProperty('--ontop',onCol(T.top));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=T.bg;
  try{LS.setItem('bgc',T.bg)}catch(e){}
}

async function translate(text,lg){
  lg=lg||trLang();
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl='+lg+'&dt=t&q='+encodeURIComponent(text));
    if(!r.ok)throw 0;
    const j=await r.json();
    const out=(j[0]||[]).map(x=>x[0]||'').join('');
    if(out)return out;
  }catch(e){}
  try{
    const parts=text.match(/[^.!?]+[.!?]*\s*/g)||[text],chunks=[];let c='';
    parts.forEach(p=>{if((c+p).length>450&&c){chunks.push(c);c=''}c+=p});
    if(c)chunks.push(c);
    const outs=[];
    for(const q of chunks){
      const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|'+lg+'&q='+encodeURIComponent(q));
      const j=await r.json();
      if(!j.responseData||j.responseStatus!=200)throw 0;
      outs.push(j.responseData.translatedText);
    }
    const o=outs.join(' ').trim();
    if(o)return o;
  }catch(e){}
  throw new Error(t('tr_fail'));
}

/* durata totale di una serie: somma delle durate di tutti gli episodi (per le statistiche) */
async function calcMin(s){
  if(s.ert===undefined){
    const d=await tmdb(`/tv/${s.id}`,{language:'en-US'});
    s.ert=(d.episode_run_time&&d.episode_run_time[0])||(d.last_episode_to_air&&d.last_episode_to_air.runtime)||0;
  }
  let sum=0,known=0,cnt=0;
  for(const x of (s.seasons||[])){
    const j=await tmdb(`/tv/${s.id}/season/${x.n}`,{language:'en-US'});
    (j.episodes||[]).forEach(e=>{cnt++;if(e.runtime>0){sum+=e.runtime;known++}});
  }
  if(!cnt)s.m=(s.ert||0)*total(s);
  else{
    const avg=known?sum/known:(s.ert||0);
    if(known)s.era=Math.round(sum/known);
    s.m=Math.round(sum+(cnt-known)*avg);
  }
  s.mok=s.m>0;s.ms=1;
}

const sgKey=s=>ty(s)+'_'+s.id+(sgMode()==='ko'?'':'_all')+'.18';
async function fetchSugg(s){
  const T=ty(s),seen=new Set([s.id]),out=[];
  let ok=false;
  const add=r=>{
    if((sgMode()==='all'||r.original_language==='ko')&&r.poster_path&&!seen.has(r.id)){
      seen.add(r.id);
      out.push({id:r.id,n:r.name||r.title||'',y:(r.first_air_date||r.release_date||'').slice(0,4),p:r.poster_path});
    }
  };
  for(const pg of [1,2]){
    try{
      const j=await tmdb(`/${T}/${s.id}/recommendations`,{language:'en-US',page:pg});
      ok=true;(j.results||[]).forEach(add);
      if((j.total_pages||1)<=pg)break;
    }catch(e){break}
  }
  if(out.length<14){
    const p={language:'en-US',sort_by:'popularity.desc','vote_count.gte':50,page:1};
    if(sgMode()==='ko')p.with_original_language='ko';
    const g=(s.gi||[]).slice(0,2).join('|');
    if(g)p.with_genres=g;
    try{
      const j=await tmdb(`/discover/${T}`,p);
      ok=true;(j.results||[]).forEach(r=>{if(out.length<18)add(r)});
    }catch(e){}
  }
  return ok?out.slice(0,18):null;
}
const sgMem={};
const sgGet=s=>sg[sgKey(s)]||sgMem[sgKey(s)];
async function loadSugg(s){
  const k=sgKey(s);
  if(!sgGet(s)){
    const r=await fetchSugg(s);
    if(!r)return;
    if(inDb(s)){sg[k]=r;try{LS.setItem('sg',JSON.stringify(sg))}catch(e){}}
    else sgMem[k]=r;
  }
  if(cur===s)renderSugg();
}

const SKIP_G=[10767,10764,10763]; /* talk show, reality, notizie */
let avw=LS.getItem('avw')==='grid'?'grid':'list';
let actorToken=0;
const CJ={Director:'d',Writer:'w',Screenplay:'w',Teleplay:'w',Story:'w',Creator:'c'};
async function getFilmo(id,mode){
  const key=(mode==='crew'?id+'c':String(id))+'.3';
  if(ac.data[key])return ac.data[key];
  const j=await tmdb(`/person/${id}/combined_credits`,{language:'en-US'});
  const seen=new Set(),out=[];
  if(mode==='crew'){
    const m=new Map();
    (j.crew||[]).forEach(r=>{
      const c=CJ[r.job];if(!c)return;
      const t=r.media_type;if(t!=='tv'&&t!=='movie')return;
      if((r.genre_ids||[]).some(g=>SKIP_G.includes(g)))return;
      const k=t+r.id;let e=m.get(k);
      if(!e){const d=r.first_air_date||r.release_date||'';e={t,id:r.id,n:r.name||r.title||'',y:d.slice(0,4),d,p:r.poster_path||'',roles:[]};m.set(k,e);out.push(e)}
      if(t==='tv'&&r.episode_count>(e.ec||0))e.ec=r.episode_count;
      e.po=Math.max(e.po||0,r.popularity||0);if(r.vote_count>0&&r.vote_average>0&&!e.va){e.va=r.vote_average;e.vn=r.vote_count}
      if(!e.roles.includes(c))e.roles.push(c);
    });
    out.forEach(e=>e.roles.sort((a,b)=>'cdw'.indexOf(a)-'cdw'.indexOf(b)));
  }else
  (j.cast||[]).forEach(r=>{
    const t=r.media_type;
    if(t!=='tv'&&t!=='movie')return;
    if((r.genre_ids||[]).some(g=>SKIP_G.includes(g)))return;
    const k=t+r.id;if(seen.has(k))return;seen.add(k);
    const d=r.first_air_date||r.release_date||'';
    out.push({t,id:r.id,n:r.name||r.title||'',y:d.slice(0,4),d,p:r.poster_path||'',ch:r.character||'',ec:t==='tv'?(r.episode_count||0):0,po:r.popularity||0,va:(r.vote_count>0&&r.vote_average>0)?r.vote_average:0,vn:r.vote_count||0});
  });
  out.sort((a,b)=>(!a.d&&b.d)?1:(a.d&&!b.d)?-1:b.d.localeCompare(a.d));
  ac.data[key]=out;ac.order=ac.order.filter(x=>x!==key);ac.order.push(key);
  while(ac.order.length>15)delete ac.data[ac.order.shift()];
  try{LS.setItem('ac',JSON.stringify(ac))}catch(e){}
  return out;
}

function ageOf(b,d){
  const B=new Date(b+'T00:00:00Z'),E=d?new Date(d+'T00:00:00Z'):new Date();
  let a=E.getUTCFullYear()-B.getUTCFullYear();
  const m=E.getUTCMonth()-B.getUTCMonth();
  if(m<0||(m===0&&E.getUTCDate()<B.getUTCDate()))a--;
  return a;
}

      if(det.b){

        if(det.d)add(t('p_died'),fmtDate(det.d));
        add(det.d?t('p_agedeath'):t('p_age'),String(ageOf(det.b,det.d)));

      if(det.pl)add(t('p_place'),det.pl);

    st.remove();
    if(!list.length){const m=document.createElement('div');m.className='msg';m.textContent=t('no_filmo');body.appendChild(m);return}

    const lst=document.createElement('div');
    const btns={};
    const FS=['r','o','p','v'];
    const sortF=a=>{
      const m=(ent&&ent.fs)||'r',l=a.slice();
      const dt=(x,y)=>(!x.d&&y.d)?1:(x.d&&!y.d)?-1:0;
      if(m==='o')l.sort((x,y)=>dt(x,y)||x.d.localeCompare(y.d));
      else if(m==='p')l.sort((x,y)=>(y.po||0)-(x.po||0));
      else if(m==='v')l.sort((x,y)=>((y.va||0)>0)-((x.va||0)>0)||(y.va||0)-(x.va||0)||(y.vn||0)-(x.vn||0));
      return l;
    };
    const sb=document.createElement('button');sb.className='psort';
    const sbT=()=>{sb.textContent=t('fs_'+((ent&&ent.fs)||'r'))+' ▾'};
    sb.onclick=async()=>{
      const cur=FS.indexOf((ent&&ent.fs)||'r');
      const v=await dlg({msg:t('fs_q'),choices:FS.map(k=>t('fs_'+k)),sel:cur});
      if(v===null||v===false||!ent)return;
      ent.fs=FS[v];sbT();paint();
    };
    const paint=()=>{
      Object.keys(btns).forEach(k=>btns[k].classList.toggle('cur',k===tab));
      if(!by[tab].length){lst.innerHTML='';const m=document.createElement('div');m.className='msg';m.textContent=t('no_filmo');lst.appendChild(m)}
      else drawFilmo(lst,sortF(by[tab]));
    };
    [['tv',CAT.tv],['movie',CAT.movie]].forEach(([k,lab])=>{
      const b=document.createElement('button');b.dataset.t=k;b.textContent=`${lab} (${by[k].length})`;
      b.onclick=()=>{tab=k;if(ent)ent.tab=k;paint()};
      btns[k]=b;tabs.appendChild(b);
    });
    sbT();tabs.appendChild(sb);
    tabs.hidden=false;body.append(lst);paint();
  }catch(e){if(tok===actorToken)st.textContent=e.message}
}

async function openEps(){
  const s=cur;
  $('#eTitle').textContent=s.name;
  $('#eSeason').hidden=true;
  openLayer('eps');
  if(!(s.seasons||[]).length&&s.v!==3){
    $('#eList').innerHTML='<div class="msg">'+t('loading')+'</div>';
    try{await fetchMeta(s);if(inDb(s))save()}catch(e){$('#eList').innerHTML='<div class="msg">'+e.message+'</div>';return}
    if(cur!==s)return;
  }
  const ss=s.seasons||[];
  const sel=$('#eSeason');sel.innerHTML='';
  const sLab=lg=>[...sel.options].forEach((o,i)=>{const x=ss[i];o.textContent=t('season_n',x.n)+(lg?' · '+(x.c===1?t('ep_1'):t('episodes_n',x.c)):'')});
  ss.forEach(x=>{const o=document.createElement('option');o.value=x.n;sel.appendChild(o)});
  sLab(false);
  const lg=()=>sLab(true),sh=()=>sLab(false);
  sel.onpointerdown=lg;sel.onfocus=lg;sel.onblur=sh;sel.onchange=e=>{sh();showSeason(cur,+e.target.value)};
  sel.hidden=ss.length<2;
  if(!ss.length){$('#eList').innerHTML='<div class="msg">'+t('no_eps_data')+'</div>';return}
  showSeason(s,ss[0].n);
}
function seenEp(s,n,pos){
  if(!inDb(s)||ty(s)!=='tv')return false;
  if(s.list==='viste')return true;
  if(s.list!=='guardando'&&s.list!=='abbandonate')return false;
  const b=seasBounds(s).find(x=>x.n===n);
  return !!b&&b.from+pos<=(s.prog||0);
}
async function showSeason(s,n){
  const L=$('#eList');
  const key=s.id+'_'+n;
  if(!epc[key]||epc[key].some(x=>x.d===undefined)){
    L.innerHTML='<div class="msg">'+tl('loading')+'</div>';
    try{
      await getSeasonEps(s,n);
    }catch(err){L.innerHTML='';const m=document.createElement('div');m.className='msg';m.textContent=err.message;L.appendChild(m);return}
  }
  if(cur!==s||+$('#eSeason').value!==n&&!$('#eSeason').hidden)return;
  L.innerHTML='';
  if(!epc[key].length){L.innerHTML='<div class="msg">'+tl('no_eps')+'</div>';return}
  {const f=epc[key].find(x=>x.d),y=f?f.d.slice(0,4):'';
   if(y&&!$('#eSeason').hidden){const yd=document.createElement('div');yd.className='eyr';yd.textContent=y;L.appendChild(yd)}}
  epc[key].forEach((e,i)=>{
    const d=document.createElement('div');d.className='ep';
    const st=document.createElement('div');st.className='still';
    if(e.i){const im=document.createElement('img');im.loading='lazy';im.src=IMG+'w300'+e.i;st.appendChild(im)}
    const t=document.createElement('div');t.className='et';
    const tt=document.createElement('span');
    const tb=document.createElement('button');tb.className='trb';tb.hidden=true;
    t.append(tt,tb);
    d.append(st,t);
    if(seenEp(s,n,i+1)){const k=document.createElement('i');k.className='ck';k.textContent='✓';st.appendChild(k)}
    const today=new Date().toLocaleDateString('en-CA');
    if(e.d&&e.d>today){const ar=document.createElement('div');ar.className='air';ar.textContent=tl('ep_airs',fmtDate(e.d));d.appendChild(ar)}
    let o=null;
    if(e.o){o=document.createElement('div');o.className='eo';d.appendChild(o)}
    const k=`e${s.id}_${n}_${e.e}@${trLang()}`;
    const paint=()=>{
      const on=trOn.has(k)&&!!trc[k];
      tt.textContent=`E${e.e} · ${on?(trc[k].t||e.t):(e.t||tl('episode_n',e.e))}`;
      if(o)o.textContent=on?trc[k].o:e.o;
      tb.hidden=!(e.o&&(on||isEn(e.o)));
      tb.disabled=false;tb.textContent=on?tl('orig'):tl('tr_btn');
    };
    tb.onclick=async()=>{
      if(trOn.has(k)){trOn.delete(k);paint();return}
      if(!trc[k]){
        tb.disabled=true;tb.textContent='…';
        try{
          const [to,tt2]=await Promise.all([translate(e.o),e.t?translate(e.t):Promise.resolve('')]);
          trc[k]={o:to,t:tt2};saveTrc();
        }catch(err){toast(err.message);paint();return}
      }
      trOn.add(k);paint();
    };
    paint();
    L.appendChild(d);
  });
  L.scrollTop=0;
}

/* apre un'altra app (CloudStream, Nuvio) con un link; ogni tocco prova un metodo diverso */
let extTry={};
function openExt(key,urls,name){
  const k=key+'|'+(cur?ty(cur)+cur.id:'');
  const n=(extTry[k]||0)%urls.length;extTry[k]=(extTry[k]||0)+1;
  const a=document.createElement('a');a.href=urls[n];a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();
  const m=$('#dCsMsg');m.hidden=true;
  let left=false;
  const off=()=>{left=true};
  window.addEventListener('blur',off,{once:true});
  document.addEventListener('visibilitychange',off,{once:true});
  setTimeout(()=>{
    window.removeEventListener('blur',off);document.removeEventListener('visibilitychange',off);
    if(!left&&!document.hidden){
      m.textContent=t('ext_fail',name,extTry[k]%urls.length+1,urls.length);
      m.hidden=false;
    }
  },1800);
}

const NV_DEF={tv:'nuvio://series/{imdb}',movie:'nuvio://movie/{imdb}'};
async function ensureImdb(s){
  if(s.imdb!==undefined)return s.imdb;
  const d=await tmdb(`/${ty(s)}/${s.id}`,{language:'en-US',append_to_response:'external_ids'});
  s.imdb=d.imdb_id||(d.external_ids&&d.external_ids.imdb_id)||'';
  if(inDb(s))save();
  return s.imdb;
}
$('#dNv').onclick=async()=>{
  const s=cur;if(!s)return;
  const m=$('#dCsMsg');
  let imdb='';
  try{imdb=await ensureImdb(s)}catch(e){m.textContent=t('imdb_unavail',e.message);m.hidden=false;return}
  if(!imdb){m.textContent=t('no_imdb');m.hidden=false;return}
  const tpl=NV_DEF[ty(s)];
  const u=tpl.replace(/\{imdb\}/g,imdb).replace(/\{tmdb\}/g,s.id).replace(/\{titolo\}/g,encodeURIComponent(s.name||'')).replace(/\{tipo\}/g,ty(s)==='tv'?'series':'movie');
  const mm=u.match(/^([a-z][a-z0-9+.-]*):\/\/(.*)$/i);
  const urls=[u];
  if(mm)urls.push(`intent://${mm[2]}#Intent;scheme=${mm[1]};end`);
  openExt('nv',urls,'Nuvio');
};

function pfFromPoster(id){
  const p=PF.list.find(x=>x.id===id);if(!p)return;
  const src=$('#zImg').currentSrc||$('#zImg').src;
  const fin=(img,link)=>{
    p.img=img;
    if(!savePF())return;
    pfPaint();try{pfDrawList()}catch(e){}
    $('#zPick').hidden=true;closeLayer('zoom');
    toast(link?t('z_link'):t('z_done',p.name));
  };
  if(/^data:/.test(src)){const im=new Image();im.onload=()=>go(im);im.onerror=()=>fin(src,false);im.src=src;return}
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>go(im);
  im.onerror=()=>fin(src,true);
  im.src=src;
  function go(im){
    try{
      const w=im.naturalWidth,h=im.naturalHeight,sd=Math.min(w,h),sx=(w-sd)/2,sy=(h-sd)*(h>w?.15:.5);
      const c=document.createElement('canvas');c.width=c.height=160;
      c.getContext('2d').drawImage(im,sx,sy,sd,sd,0,0,160,160);
      fin(c.toDataURL('image/jpeg',.85),false);
    }catch(e){fin(src,true)}
  }
}

/* ---------- stagioni: spunte in sequenza ---------- */
let seasS=null;const seasOpen=new Set();
const seasOf=s=>(s.seasons||[]).slice().sort((a,b)=>a.n-b.n);
function seasBounds(s){let a=0;return seasOf(s).map(x=>{const r={n:x.n,c:x.c,from:a,to:a+x.c};a+=x.c;return r})}
async function getSeasonEps(s,n){
  const key=s.id+'_'+n;
  if(!epc[key]||epc[key].some(x=>x.d===undefined)){
    const j=await tmdb(`/tv/${s.id}/season/${n}`,{language:'en-US'});
    epc[key]=(j.episodes||[]).map(e=>({e:e.episode_number,t:e.name||'',o:e.overview||'',i:e.still_path||'',d:e.air_date||''}));
    saveEps();
  }
  return epc[key];
}
function openSeas(s){
  if(!seasN(s))return;
  seasS=s;seasOpen.clear();$('#sTitle').textContent=s.name;
  $('#sList').scrollTop=0;drawSeas();openLayer('seas');
}
function tickEl(on,fn){
  const k=document.createElement('button');k.className='tk'+(on?' on':'');k.textContent='✓';
  k.setAttribute('aria-pressed',on?'true':'false');k.onclick=fn;return k;
}
function drawSeas(){
  const s=seasS;if(!s)return;
  const L=$('#sList'),y=L.scrollTop;L.innerHTML='';
  const p=s.prog||0;
  seasBounds(s).forEach(b=>{
    const done=Math.max(0,Math.min(b.c,p-b.from)),open=seasOpen.has(b.n);
    const w=document.createElement('div');w.className='seasbox';w.dataset.sn=b.n;
    const h=document.createElement('div');h.className='sh2';
    const nb=document.createElement('button');nb.className='sn';
    nb.textContent=`${t('season_n',b.n)} · ${done}/${b.c}  ${open?'▴':'▾'}`;
    nb.onclick=()=>{if(open)seasOpen.delete(b.n);else seasOpen.add(b.n);drawSeas();if(!open)getSeasonEps(s,b.n).then(()=>{if(seasS===s&&seasOpen.has(b.n))drawSeas()}).catch(()=>{})};
    const full=p>=b.to;
    h.append(nb,tickEl(full,()=>setProg(s,full?b.from:b.to)));
    w.appendChild(h);
    if(open){
      const eps=epc[s.id+'_'+b.n]||[];
      for(let i=1;i<=b.c;i++){
        const ep=eps[i-1],abs=b.from+i,on=p>=abs;
        const r=document.createElement('div');r.className='sep';
        const sp=document.createElement('span');sp.textContent=`E${ep?ep.e:i} · ${(ep&&ep.t)||t('episode_n',ep?ep.e:i)}`;
        r.append(sp,tickEl(on,()=>setProg(s,on?abs-1:abs)));
        w.appendChild(r);
      }
    }
    L.appendChild(w);
  });
  L.scrollTop=y;
}
const seasP=(b,i)=>i===0?0:b[i-1].to;
async function askSeasons(s,p){
  await ensureSeasons(s);
  const b=seasBounds(s);
  if(b.length<2)return -1;
  let sel=0;for(let i=1;i<=b.length;i++)if(b[i-1].to<=p)sel=i;
  const ch=[t('seas_none')];b.forEach((x,i)=>ch.push(i===b.length-1?t('seas_all'):t('seas_upto',x.n)));
  const v=await dlg({msg:t('seas_q'),choices:ch,sel});
  return v===null||v===false?null:v;
}
/* applica la scelta delle stagioni; restituisce la lista di destinazione */
function applySeasonChoice(s,r,k){
  const b=seasBounds(s);
  if(r===b.length&&b.length>=2){s.prog=total(s)||b[b.length-1].to;return 'viste'}
  s.prog=seasP(b,r);return k;
}
async function moveTo(s,k){
  const from=s.list,T=ty(s),act=l=>l==='guardando'||l==='abbandonate';
  if(T==='tv'){
    const askIt=(k==='guardando'&&from!=='guardando')||(k==='abbandonate'&&!act(from));
    if(askIt){
      const r=await askSeasons(s,s.prog||0);
      if(r===null)return;
      if(r>=0)k=applySeasonChoice(s,r,k);
    }else if(k==='viste'){s.prog=total(s)||s.prog||0}
    else if(k==='vedere'||k==='indeciso')s.prog=0;
  }
  if(s.list!==k)listChanged(s);
  s.list=k;save();render();if(cur===s)renderDetail();
}

let edt=null;
function openEdit(x,s){
  const T=x.t||ty(x);
  const it=s||findDb(T,x.id)||{id:x.id,type:T,name:x.n||x.name,year:x.y||x.year,path:x.p||x.path};
  const inl=inDb(it);
  edt={it,inl,list:inl?it.list:null,prog:it.prog||0,touched:false};
  $('#edt').classList.remove('kb');
  edt.ds=dateSelects(inl?it.da:todayISO(),()=>{edt.touched=true});
  edt.orig=inl?(it.da||todayISO()):todayISO();
  $('#eDate').innerHTML='';$('#eDate').appendChild(edt.ds.el);
  edt.my=mySelects(inl?myOf(it):null);
  $('#eMy').innerHTML='';$('#eMy').appendChild(edt.my.el);
  $('#eNote').value=inl?(it.note||''):'';
  const T2=ty(it);
  $('#eT').textContent=it.name;
  $('#eM').textContent=[T2==='tv'?(CAT.tv&&t('k_serie')):t('k_film'),it.year].filter(Boolean).join(' · ');
  const bits=[];if(voteOf(it))bits.push('★ '+voteOf(it).toFixed(1));
  if(T2==='tv'&&total(it))bits.push(t('episodes_n',total(it)));else if(T2==='movie'&&it.runtime)bits.push(fmtRun(it.runtime));
  $('#eV').textContent=bits.join(' · ');
  const im=$('#eImg');im.removeAttribute('src');
  if(poster(it,'w185'))im.src=poster(it,'w185');else fillImg(im,T2,it.id,it.path||x.p,'w185');
  const sel=$('#eSel');sel.innerHTML='';
  Object.entries(LISTS[T2]).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;sel.appendChild(o)});
  if(!inl){const o=document.createElement('option');o.value='';o.textContent='—';o.disabled=true;sel.insertBefore(o,sel.firstChild)}
  sel.value=inl?it.list:'';
  $('#eDel').hidden=!inl;
  edtPaint();
  openLayer('edt');
  if(T2==='tv'&&!seasN(it)){ensureSeasons(it).then(()=>{if(edt&&edt.it===it)edtPaint()})}
}
function edtPaint(){
  if(!edt)return;
  const it=edt.it,act=edt.list==='guardando'||edt.list==='abbandonate';
  const box=$('#eProg');box.hidden=!(ty(it)==='tv'&&act);
  if(box.hidden)return;
  const tot=total(it),p=edt.prog;
  $('#eLab').textContent=tot?p+'/'+tot:String(p);
  $('#eFill').style.width=tot?Math.min(100,p/tot*100)+'%':'0';
  $('#eFill').parentElement.hidden=!tot;
  const n=seasN(it),sb=$('#eSeasB');sb.hidden=n<2;
  if(n>=2)sb.textContent=t('seas_q_btn');
}
$('#eSel').onchange=e=>{
  edt.list=e.target.value;
  if(edt.inl&&!edt.touched)edt.ds.set(edt.list!==edt.it.list?todayISO():edt.orig);
  if(edt.list==='viste')edt.prog=total(edt.it)||edt.prog;
  edtPaint();
};
const edtStep=d=>{if(!edt)return;const tot=total(edt.it);let p=Math.max(0,edt.prog+d);if(tot&&p>tot)p=tot;edt.prog=p;edtPaint()};
$('#eMi').onclick=()=>edtStep(-1);
$('#ePl').onclick=()=>edtStep(1);
$('#eSeasB').onclick=async()=>{
  if(!edt)return;
  const it=edt.it,r=await askSeasons(it,edt.prog);
  if(r===null||r<0||!edt)return;
  const b=seasBounds(it);
  if(r===b.length&&b.length>=2){edt.list='viste';edt.prog=total(it)||b[b.length-1].to;$('#eSel').value='viste'}
  else edt.prog=seasP(b,r);
  edtPaint();
};

/* ---------- filtri della ricerca ---------- */
const flt={on:false,g:'',y1:'',y2:'',o:'recent'};
let fltCur=null,fltTok=0;const glc={};
function paintFlt(){$('#sFlt').classList.toggle('act',flt.on)}
function fltReset(){flt.on=false;flt.g='';flt.y1='';flt.y2='';flt.o='recent';fltCur=null;fltTok++;paintFlt()}
async function fltGenres(T){
  if(glc[T])return glc[T];
  try{const j=await tmdb('/genre/'+T+'/list',{language:'en-US'});glc[T]=(j.genres||[]).slice().sort((a,b)=>a.name.localeCompare(b.name))}catch(e){return []}
  return glc[T];
}
const FO=[['recent','fs_r'],['old','fs_o'],['popd','fo_pd'],['popa','fo_pa'],['votd','fo_vd'],['vota','fo_va']];
async function openFlt(){
  const T=searchCat||cat;if(T==='person')return;
  const opt=(v,l)=>{const o=document.createElement('option');o.value=v;o.textContent=l;return o};
  const G=$('#fG');G.innerHTML='';G.appendChild(opt('',t('flt_gall')));
  (await fltGenres(T)).forEach(g=>G.appendChild(opt(String(g.id),g.name)));
  G.value=flt.g;
  const yr=new Date().getFullYear()+1;
  ['fY1','fY2'].forEach(id=>{const e=$('#'+id);e.innerHTML='';e.appendChild(opt('',t('flt_any')));for(let y=yr;y>=1950;y--)e.appendChild(opt(String(y),String(y)))});
  $('#fY1').value=flt.y1;$('#fY2').value=flt.y2;
  const O=$('#fO');O.innerHTML='';FO.forEach(x=>O.appendChild(opt(x[0],t(x[1]))));O.value=flt.o;
  openLayer('flt');
}
function fltParams(T,page){
  const o=flt.o,tv=T==='tv',dk=tv?'first_air_date':'primary_release_date';
  const p={language:'en-US',page,include_adult:'false'};
  const sb={recent:dk+'.desc',old:dk+'.asc',popd:'popularity.desc',popa:'popularity.asc',votd:'vote_average.desc',vota:'vote_average.asc'}[o]||'popularity.desc';
  p.sort_by=sb;
  p['vote_count.gte']=(o==='votd'||o==='vota')?200:(o==='popd'||o==='popa')?50:5;
  if(flt.g)p.with_genres=flt.g;else if(tv)p.without_genres='10767,10764,10763';
  if(flt.y1)p[dk+'.gte']=flt.y1+'-01-01';
  if(flt.y2)p[dk+'.lte']=flt.y2+'-12-31';
  else if(o==='recent'||o==='votd'||o==='popd')p[dk+'.lte']=todayISO();
  if(sgMode()==='ko')p.with_original_language='ko';
  return p;
}
async function runFilter(first){
  const T=searchCat||cat;if(T==='person')return;
  if(first){fltCur={T,page:0,more:false,items:[]};$('#res').innerHTML='';$('#hist').hidden=true;try{$('#q').blur()}catch(e){}}
  const c=fltCur;if(!c)return;
  const tok=++fltTok;
  $('#res').classList.add('lst');
  $('#sMsg').textContent=t('loading');$('#fMore').disabled=true;
  try{
    const j=await tmdb('/discover/'+c.T,fltParams(c.T,c.page+1));
    if(tok!==fltTok)return;
    c.page++;
    const seen=new Set(c.items.map(x=>x.id));
    (j.results||[]).forEach(r=>{
      if(!r.poster_path||seen.has(r.id))return;seen.add(r.id);
      const x={t:c.T,id:r.id,n:r.name||r.title||'',y:(r.first_air_date||r.release_date||'').slice(0,4),p:r.poster_path,g:[]};
      c.items.push(x);$('#res').appendChild(listRow(x));
    });
    c.more=c.page<(j.total_pages||1)&&c.page<50;
    $('#sMsg').textContent=c.items.length?'':t('no_results');
    $('#fMore').hidden=!c.more;$('#fMore').disabled=false;
  }catch(e){if(tok===fltTok){$('#sMsg').textContent=e.message;$('#fMore').disabled=false}}
}

function mlPath(u){
  u=(u||'').trim().replace(/[?#].*$/,'').replace(/\/+$/,'');
  const m=u.match(/lists\/([^\/]+)\/([^\/]+)(?:\/[a-z]+)?$/i);
  if(m)return m[1]+'/'+m[2];
  return u.replace(/^https?:\/\/[^\/]+\//,'');
}
async function mdbFetch(path,off){
  const key=(cfg.mdb||'').trim();
  let r;
  try{r=await fetch(`https://api.mdblist.com/lists/${path}/items?apikey=${encodeURIComponent(key)}&limit=${ML_LIM}&offset=${off}`)}
  catch(e){throw new Error(t('mdb_net'))}
  if(!r.ok)throw new Error(t('mdb_err',r.status)+(r.status===401||r.status===403?t('mdb_badkey'):r.status===404?t('mdb_404'):''));
  const j=await r.json();
  let arr;
  if(Array.isArray(j))arr=j;
  else arr=[...(j.movies||[]).map(x=>({...x,mediatype:x.mediatype||'movie'})),...(j.shows||[]).map(x=>({...x,mediatype:x.mediatype||'show'}))].sort((a,b)=>(a.rank||0)-(b.rank||0));
  const items=[];
  arr.forEach(x=>{
    const id=x.tmdb_id||x.id;if(!id)return;
    const gr=x.genre||x.genres;let g=[];
    if(Array.isArray(gr))g=gr.map(q=>typeof q==='string'?q:(q&&(q.title||q.name))||'');
    else if(typeof gr==='string')g=gr.split(/[,|]/);
    g=g.map(z=>String(z).trim().replace(/-/g,' ')).filter(Boolean).map(z=>z[0].toUpperCase()+z.slice(1)).slice(0,3);
    items.push({t:x.mediatype==='movie'?'movie':'tv',id,n:x.title||x.name||'',y:String(x.release_year||x.year||''),g});
  });
  return {items,more:arr.length>=ML_LIM};
}

/* prossime uscite: titoli con data futura, dalla più vicina; scarta le voci quasi senza popolarità */
const UP_POP_KO=0,UP_POP_ALL=8;
async function loadUp(){
  const c=mlCur,tok=c.tok;$('#mMore').disabled=true;
  try{
    const tv=c.T==='tv',dk=tv?'first_air_date':'primary_release_date',today=todayISO();
    const seen=new Set(c.items.map(x=>x.t+x.id));
    let added=0,tries=0,tp=1;
    while(added<10&&tries<4&&c.page<tp&&c.page<50){
      const p={language:'en-US',sort_by:dk+'.asc',page:c.page+1,include_adult:'false'};
      p[dk+'.gte']=today;
      if(tv)p.without_genres='10767,10764,10763';
      if(c.ko)p.with_original_language='ko';
      const j=await tmdb('/discover/'+c.T,p);
      if(tok!==mlTok)return;
      c.page++;tries++;tp=j.total_pages||1;
      (j.results||[]).forEach(r=>{
        const d=r.first_air_date||r.release_date||'';
        if(!r.poster_path||!d||d<today||seen.has(c.T+r.id))return;
        if((r.popularity||0)<(c.ko?UP_POP_KO:UP_POP_ALL))return;
        seen.add(c.T+r.id);added++;
        c.items.push({t:c.T,id:r.id,n:r.name||r.title||'',y:d.slice(0,4),p:r.poster_path,g:[],d});
      });
    }
    c.more=c.page<tp&&c.page<50;
    drawMl();
  }catch(e){
    if(tok!==mlTok)return;
    $('#mMsg').textContent=e.message;$('#mMore').disabled=false;
  }
}

async function loadSgAll(){
  const c=mlCur,tok=c.tok;$('#mMore').disabled=true;
  const seen=new Set(c.items.map(x=>x.id));seen.add(c.sid);
  const add=r=>{
    if((sgMode()==='all'||r.original_language==='ko')&&r.poster_path&&!seen.has(r.id)){
      seen.add(r.id);c.items.push({t:c.T,id:r.id,n:r.name||r.title||'',y:(r.first_air_date||r.release_date||'').slice(0,4),p:r.poster_path,g:[]});
    }
  };
  try{
    const first=!c.items.length;
    if(first){
      for(const pg of [1,2]){
        let j;try{j=await tmdb(`/${c.T}/${c.sid}/recommendations`,{language:'en-US',page:pg})}catch(e){break}
        if(tok!==mlTok)return;
        (j.results||[]).forEach(add);
        if((j.total_pages||1)<=pg)break;
      }
      c.page=0;
    }
    if(!first||c.items.length<14){
      const p={language:'en-US',sort_by:'popularity.desc','vote_count.gte':50,page:c.page+1};
      if(sgMode()==='ko')p.with_original_language='ko';
      if(c.gi)p.with_genres=c.gi;
      const j=await tmdb('/discover/'+c.T,p);
      if(tok!==mlTok)return;
      c.page++;(j.results||[]).forEach(add);
      c.more=c.page<(j.total_pages||1)&&c.page<50;
    }else c.more=true;
    drawMl();
  }catch(e){
    if(tok!==mlTok)return;
    $('#mMsg').textContent=e.message;$('#mMore').disabled=false;
  }
}
async function loadGenre(){
  const c=mlCur,tok=c.tok;$('#mMore').disabled=true;
  try{
    const p={language:'en-US',with_genres:String(c.gid),sort_by:'popularity.desc','vote_count.gte':30,page:c.page+1};
    if(c.o&&c.o!=='popd')soParams(p,c.o,c.T,c.T==='tv');
    if(sgMode()==='ko')p.with_original_language='ko';
    const j=await tmdb('/discover/'+c.T,p);
    if(tok!==mlTok)return;
    c.page++;
    const seen=new Set(c.items.map(x=>x.t+x.id));
    (j.results||[]).forEach(r=>{
      if(!r.poster_path||seen.has(c.T+r.id))return;seen.add(c.T+r.id);
      c.items.push({t:c.T,id:r.id,n:r.name||r.title||'',y:(r.first_air_date||r.release_date||'').slice(0,4),p:r.poster_path,g:[]});
    });

  }catch(e){
    if(tok!==mlTok)return;
    $('#mMsg').textContent=e.message;$('#mMore').disabled=false;
  }
}
async function loadMl(force){
  const c=mlCur,tok=c.tok;
  if(c.kind==='genre')return loadGenre();
  if(c.kind==='sugg')return loadSgAll();
  if(c.kind==='up')return loadUp();
  if(!c.items.length&&!force&&ml[c.path]&&ml[c.path].v===2&&Date.now()-ml[c.path].t<6*3600e3){
    c.items=ml[c.path].items.slice();c.more=ml[c.path].more;drawMl();return;
  }
  $('#mMore').disabled=true;
  try{
    const r=await mdbFetch(c.path,c.items.length);
    if(tok!==mlTok)return;
    const seen=new Set(c.items.map(x=>x.t+x.id));
    r.items.forEach(x=>{if(!seen.has(x.t+x.id)){seen.add(x.t+x.id);c.items.push(x)}});
    c.more=r.more;
    if(c.items.length<=ML_LIM){ml[c.path]={v:2,t:Date.now(),items:c.items.slice(),more:c.more};try{LS.setItem('ml',JSON.stringify(ml))}catch(e){}}
    drawMl();
  }catch(e){
    if(tok!==mlTok)return;
    $('#mMsg').textContent=e.message;$('#mMore').disabled=false;
  }
}

function fmtT(m){
  const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60,p=[];
  if(d)p.push(d+'d');if(h)p.push(h+'h');if(mm||!p.length)p.push(mm+'m');

}
const stIncl=s=>{const t=ty(s);return s.list===DEF[t]||(t==='tv'&&((s.list==='guardando'&&!!cfg.stG)||(s.list==='abbandonate'&&!!cfg.stA)))};
function calcStats(){
  const r={tv:{min:0,eps:0,n:0,pend:0,miss:0},movie:{min:0,n:0,pend:0,miss:0}};
  db.forEach(s=>{
    const t=ty(s);if(!stIncl(s))return;
    const o=r[t];o.n++;
    if(t==='tv'&&s.list!==DEF.tv){
      const tot=total(s),p=Math.min(s.prog||0,tot||s.prog||0);
      o.eps+=p;
      if(s.ms!==1)o.pend++;else if(!s.mok)o.miss++;
      o.min+=tot&&s.m?Math.round(s.m*p/tot):(s.ert||0)*p;
    }
    else if(t==='tv'){o.eps+=total(s);if(s.ms!==1)o.pend++;else if(!s.mok)o.miss++;o.min+=s.m||0}
    else{if(s.v!==3)o.pend++;else if(!s.runtime)o.miss++;o.min+=s.runtime||0}
  });
  return r;
}
function renderStats(note){
  const r=calcStats();
  $('#stTvT').textContent=fmtT(r.tv.min);
  $('#stTvN').textContent=t('st_series',r.tv.eps,r.tv.n);
  $('#stMvT').textContent=fmtT(r.movie.min);
  $('#stMvN').textContent=t('st_movies',r.movie.n);
  if(note!==undefined){$('#stMsg').textContent=note;return}
  const pend=r.tv.pend+r.movie.pend,miss=r.tv.miss+r.movie.miss,parts=[];
  if(pend)parts.push(t('st_pend',pend));
  if(miss)parts.push(t('st_miss',miss));
  $('#stMsg').textContent=parts.join(' ');
}

$('#stUpd').onclick=async()=>{
  const todo=db.filter(s=>stIncl(s)&&(ty(s)==='tv'?s.ms!==1:s.v!==3));
  if(!todo.length){renderStats(t('st_uptodate'));return}
  const tot=todo.length;let n=0,err=0,last='',stop=false;
  $('#stUpd').disabled=true;
  const worker=async()=>{
    while(todo.length&&!stop){
      const s=todo.shift();
      try{
        if(s.v!==3)await fetchMeta(s);
        if(ty(s)==='tv')await calcMin(s);
      }catch(e){err++;last=e.message;if(e.fatal)stop=true}
      renderStats(t('st_calc',++n,tot));
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  save();render();$('#stUpd').disabled=false;
  renderStats(err?t('st_done_err',err,last):t('st_done'));
};

  const out={app:'k-list',v:3,cur:PF.cur,ask:!!PF.ask,shared:sh,profiles:PF.list.map(p=>({...p,data:p.id===PF.cur?pfSnap():JSON.parse(LS.getItem('pfd_'+p.id)||'null')||pfNew()}))};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
  a.download='k-list-backup.json';a.click();
};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';
  try{
    const j=JSON.parse(await file.text());
    if(j&&!Array.isArray(j)&&j.v===3&&Array.isArray(j.profiles)){
      const list=j.profiles.slice(0,4).filter(p=>p&&p.id&&p.data);
      if(!list.length)throw 0;
      if(!await dlg({msg:t('pf_imp_q'),yes:t('ok')}))return;
      PF.list.forEach(p=>LS.removeItem('pfd_'+p.id));
      const curId=list.some(p=>p.id===j.cur)?j.cur:list[0].id;
      const sh=j.shared||{};PF_SH.forEach(k=>{if(sh[k]!=null)cfg[k]=sh[k]});
      list.forEach(p=>{if(p.id!==curId)LS.setItem('pfd_'+p.id,JSON.stringify(p.data))});
      pfApply(list.find(p=>p.id===curId).data);
      PF={v:1,cur:curId,ask:!!j.ask,list:list.map(p=>{const o={id:p.id,name:String(p.name||'').slice(0,14)||t('pf_n',1),color:p.color||PF_COL[0]};if(p.img)o.img=p.img;return o})};
      savePF();LS.flush().then(()=>location.reload());return;
    }
    const items=Array.isArray(j)?j:(j&&Array.isArray(j.items)?j.items:null);
    if(!items)throw 0;
    items.forEach(norm);items.forEach(x=>{if(!x.da)x.da=todayISO()});db=items;save();
    if(j&&!Array.isArray(j)&&j.cfg&&typeof j.cfg==='object'){
      const old=cfg;cfg=migCfg(j.cfg);['tmdb','mdb','pic'].forEach(k=>{if(cfg[k]==null&&old[k]!=null)cfg[k]=old[k]});saveCfg();
      if(cfg.lang&&I18N[cfg.lang])LANG=cfg.lang;LSAVED=LANG;
      refreshNames();applyI18n();fillTrLang();applyTheme();applyCols();applyHdr();renderMl();
    }
    render();toast(t('imported'));
  }catch(_){toast(t('bad_file'))}
};
/* ---------- aggiornamenti ---------- */
const verNum=v=>String(v||'').replace(/^[^\d]*/,'').split(/[.\-+]/).map(x=>parseInt(x,10)||0);
const verCmp=(a,b)=>{a=verNum(a);b=verNum(b);for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d>0?1:-1}return 0};
$('#updChk').onclick=async()=>{
  const b=$('#updChk');b.disabled=true;
  try{
    const r=await fetch('https://api.github.com/repos/'+REPO+'/releases/latest',{headers:{Accept:'application/vnd.github+json'}});
    if(r.status===404){toast(t('upd_none',APP_VERSION));b.disabled=false;return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json(),tag=String(j.tag_name||j.name||'');
    if(verCmp(tag,APP_VERSION)>0){
      const as=(j.assets||[]).find(x=>/\.apk$/i.test(x.name||''));
      const url=as?as.browser_download_url:j.html_url;
      const y=await dlg({msg:t('upd_new',tag.replace(/^[^\d]*/,'')),yes:t('upd_go')});
      if(y&&url){
        const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';
        document.body.appendChild(a);a.click();a.remove();
        toast(t('upd_dl'));
      }
    }else toast(t('upd_none',APP_VERSION));
  }catch(e){toast(t('upd_err',e.message))}
  b.disabled=false;
};

/* ---------- aggiornamento automatico (voti e dettagli), al massimo una volta a settimana ---------- */
async function autoRefresh(force){
  if(autoRefresh.run||(!force&&navigator.webdriver))return;
  let last=0;try{last=+LS.getItem('arf')||0}catch(e){}
  if(!db.length||(!force&&Date.now()-last<6048e5))return;
  autoRefresh.run=true;
  let fatal=false;
  try{
    const old=s=>s.v!==3||s.va===undefined||s.imdb===undefined||s.ol!=='en'||s.cn!==18||s.nw===undefined||(s.type==='movie'&&s.bu===undefined);
    const meta=db.filter(old);
    let i=0;
    for(const s of meta){
      try{await fetchMeta(s)}catch(e){if(e.fatal){fatal=true;break}}
      if(++i%10===0)save();
    }
    if(!fatal){
      const todo=db.filter(s=>!meta.includes(s));
      const worker=async()=>{
        while(todo.length&&!fatal){
          const s=todo.shift();
          try{const d=await tmdb(`/${ty(s)}/${s.id}`,{language:'en-US'});s.va=d.vote_average||0;s.vc=d.vote_count||0}
          catch(e){if(e.fatal)fatal=true}
        }
      };
      await Promise.all([worker(),worker(),worker()]);
    }
    save();render();
    if(cur&&$('#detail').classList.contains('on'))renderDetailIf(cur);
    if(!fatal)try{LS.setItem('arf',String(Date.now()))}catch(e){}
  }catch(e){}
  autoRefresh.run=false;
}
setTimeout(autoRefresh,4000);

applyCols();
renderMl();
render();
document.documentElement.classList.remove('boot');
pfPaint();
setTimeout(imBulk,3500);
try{if(PF.ask&&!sessionStorage.getItem('pfpick'))pfShowAsk()}catch(e){}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
<script>
(function(){
var real=null;try{real=window.localStorage}catch(e){}
var mem=new Map(),dirty=new Map(),clr=false,timer=0,chain=Promise.resolve(),db=null,DB='klist',ST='kv';
function runApp(){
  var el=document.getElementById('appjs'),sc=document.createElement('script');
  sc.textContent=el.textContent;document.body.appendChild(sc);
}
function useReal(){
  window.LS={getItem:function(k){return real.getItem(k)},setItem:function(k,v){real.setItem(k,v)},removeItem:function(k){real.removeItem(k)},clear:function(){real.clear()},flush:function(){return Promise.resolve()}};
  runApp();
}
function open(){return new Promise(function(res,rej){
  var r=indexedDB.open(DB,1);
  r.onupgradeneeded=function(){r.result.createObjectStore(ST)};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.onblocked=function(){rej(new Error('blocked'))};
})}
function loadAll(d){return new Promise(function(res,rej){
  var tx=d.transaction(ST,'readonly'),st=tx.objectStore(ST),ks=st.getAllKeys(),vs=st.getAll();
  tx.oncomplete=function(){res([ks.result,vs.result])};tx.onerror=function(){rej(tx.error)};tx.onabort=function(){rej(tx.error)};
})}
function write(ops,clear){return new Promise(function(res,rej){
  var tx=db.transaction(ST,'readwrite'),st=tx.objectStore(ST);
  if(clear)st.clear();
  ops.forEach(function(o){if(o[1]===null)st.delete(o[0]);else st.put(o[1],o[0])});
  tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)};tx.onabort=function(){rej(tx.error)};
})}
function flush(){
  clearTimeout(timer);timer=0;
  if(!dirty.size&&!clr)return chain;
  var ops=[];dirty.forEach(function(v,k){ops.push([k,v])});var c=clr;dirty=new Map();clr=false;
  chain=chain.then(function(){return write(ops,c)}).catch(function(e){
    try{toast(t('memfull'))}catch(x){}
  });
  return chain;
}
function sched(){if(!timer)timer=setTimeout(flush,40)}
function bgc(k,v){if(k==='bgc'&&real){try{if(v===null)real.removeItem(k);else real.setItem(k,v)}catch(e){}}}
function init(){
  window.LS={
    getItem:function(k){return mem.has(k)?mem.get(k):null},
    setItem:function(k,v){v=String(v);mem.set(k,v);dirty.set(k,v);bgc(k,v);sched()},
    removeItem:function(k){mem.delete(k);dirty.set(k,null);bgc(k,null);sched()},
    clear:function(){mem.clear();dirty=new Map();clr=true;if(real){try{real.clear()}catch(e){}}sched()},
    flush:flush
  };
  addEventListener('pagehide',flush);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush()});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  runApp();
}
if(!window.indexedDB){useReal();return}
open().then(function(d){db=d;return loadAll(d)}).then(function(a){
  var ks=a[0],vs=a[1],migrated=false;
  ks.forEach(function(k,i){mem.set(k,vs[i]);if(k==='__mig')migrated=true});
  if(migrated){mem.delete('__mig');if(real){try{Object.keys(real).forEach(function(k){if(k!=='bgc'&&mem.has(k))real.removeItem(k)})}catch(e){}}init();return}
  var ops=[],keys=[];
  if(real){for(var i=0;i<real.length;i++){var k=real.key(i);keys.push(k)}
    keys.forEach(function(k){var v=real.getItem(k);if(v!==null){ops.push([k,v]);mem.set(k,v)}})}
  ops.push(['__mig','1']);
  return write(ops,false).then(function(){
    return loadAll(db)
  }).then(function(b){
    var chk=new Map();b[0].forEach(function(k,i){chk.set(k,b[1][i])});
    for(var x=0;x<ops.length;x++){if(chk.get(ops[x][0])!==ops[x][1])throw new Error('verify')}
    keys.forEach(function(k){if(k!=='bgc'){try{real.removeItem(k)}catch(e){}}});
    init();
  });
}).catch(function(e){
  try{console.warn('IDB fallback',e)}catch(x){}
  mem.clear();
  if(real)useReal();else{window.LS={getItem:function(){return null},setItem:function(){},removeItem:function(){},clear:function(){},flush:function(){return Promise.resolve()}};runApp()}
});
})();
</script>
