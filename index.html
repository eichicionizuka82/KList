<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>K-LIST</title>
<style>
#dMove{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#dMove:empty{display:none}
#dMove button{background:var(--panel);color:var(--fg);display:flex;align-items:center;justify-content:center;text-align:center;min-height:54px;padding:10px 6px;font-size:15px;line-height:1.2;white-space:normal}
#dMove button:last-child:nth-child(odd){grid-column:1/-1}
.phd{display:flex;gap:14px;align-items:flex-start;padding:6px 0 4px}
.pph{flex:none;width:38%;max-width:170px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--mut)}
.pph img{width:100%;height:100%;object-fit:cover;display:block}
.pside{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:10px}
.pnm{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.pln{overflow-wrap:anywhere}
.pln small{display:block;font-size:12px;color:var(--mut)}
.pln span{display:block;font-size:15px;color:var(--fg);margin-top:1px}
.pgal{align-self:flex-start;background:none;color:var(--acc);font-weight:700;padding:2px 0;border-radius:0;text-align:left}
.pgal[hidden]{display:none}
#galG{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#galG img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--panel);cursor:pointer;display:block}
.ptabs{display:flex;gap:24px;margin:16px 0 12px}
.ptabs button{background:none;color:var(--sub);padding:6px 0;font-weight:700;font-size:17px;border-radius:0}
.ptabs button.cur{background:none;color:var(--acc)}
.res .c em{display:block;font-style:normal;color:var(--mut);font-size:11px}
.res .pphx{aspect-ratio:2/3;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--mut);border-radius:8px}
.stype{flex-wrap:wrap}
.stype button[data-t=person]{flex:1 1 100%}

.sl{color:var(--acc);font-weight:600;cursor:pointer}
.lab{margin:24px 0 0;font-size:15px;font-weight:700;color:var(--fg)}
#dAvail[hidden],#dCrewW[hidden],#dCastW[hidden],#dTiles[hidden]{display:none}
.prov{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prov span{display:inline-flex;align-items:center;gap:8px;background:var(--p2);border-radius:20px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600}
.prov img{width:28px;height:28px;border-radius:50%}
.jw{font-size:10px;color:var(--mut);margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.tiles div{background:var(--panel);color:var(--fg);border-radius:12px;padding:14px;min-height:64px;min-width:0}
.tiles b{display:block;font-size:17px;overflow-wrap:anywhere}
.tiles small{display:block;font-size:13px;color:var(--sub);margin-top:3px}
.tiles i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;box-shadow:0 0 0 1.5px #fff}
.cast .ph{width:60px;height:60px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;margin:0 auto 5px;font-size:22px;color:var(--mut)}
#dPic.cur,#dReset.cur,#dTmdb.cur{background:var(--acc);color:var(--onacc)}
#settings{--st-t:#f7f7f4;--st-s:#cacac7}
:root[data-light="1"] #settings{--st-t:#1a1b24;--st-s:#4a4c5c}
#settings .body{padding:0 16px 28px}
#stMenu{margin-top:30px}
.strow{display:flex;align-items:center;gap:20px;width:100%;padding:15px 4px;background:none;border-radius:0;text-align:left}
.strow svg{flex:none;width:28px;height:28px;color:var(--st-t)}
.strow b{display:block;font-size:19px;font-weight:600;color:var(--st-t)}
.strow small{display:block;font-size:14px;color:var(--st-s);margin-top:3px;line-height:1.35}
.stp{margin:22px 0 14px;font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.cd{display:block;width:100%;background:var(--panel);border-radius:14px;padding:16px;margin:0 0 12px;text-align:left;color:var(--fg);text-decoration:none}
.cd h5{margin:0;font-size:17px;font-weight:700}
.cd p{margin:3px 0 0;font-size:14px;color:var(--mut)}
.cd .cb{margin-top:12px}
#settings .cd input:not([type=checkbox]),#settings .cd select{width:100%;background:var(--p2)}
.cd.act{display:flex;align-items:center;justify-content:space-between;gap:14px}
.cd.act svg{flex:none;width:22px;height:22px;color:var(--mut)}
.cd.dng h5,.cd.dng svg{color:var(--red)}
.cd.ver{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700}
.cd.ver span{color:var(--mut);font-weight:600}
.acch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;padding:0;border-radius:0;text-align:left;color:inherit}
.acch i{font-style:normal;color:var(--mut);font-size:22px;transition:transform .2s}
.cd.open .acch i{transform:rotate(90deg)}
.accb{display:none;margin-top:14px}
.cd.open .accb{display:block}
.seg{display:flex;margin-top:12px;border-bottom:1px solid var(--line)}
.seg button{flex:1;background:none;border-radius:0;padding:10px 4px;color:var(--mut);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--acc);border-bottom-color:var(--acc)}
.swt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 0;color:var(--fg);font-size:15px}
#settings .swt input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:13px;background:var(--p2);border:0;position:relative;flex:none;padding:0;cursor:pointer;transition:background .2s}
.swt input::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
#settings .swt input:checked{background:var(--acc)}
.swt input:checked::after{transform:translateX(20px)}
.tmdbl{width:64px;height:40px;margin:0 auto 12px;border-radius:10px;background:linear-gradient(135deg,#90cea1,#01b4e4);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#0d253f}
#dSeas{margin-top:2px}
#dlgCh{display:flex;flex-direction:column;gap:6px;margin:12px 0 4px;max-height:50vh;overflow:auto}
#dlgCh[hidden],#dlgYes[hidden]{display:none}
.seasbox{background:var(--panel);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sh2{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 0}
.sh2 .sn{flex:1;text-align:left;background:none;padding:12px 14px;font-weight:700}
.tk{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;flex:none;padding:0;background:none;color:transparent;font-size:15px}
.tk.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.sep{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-top:1px solid var(--line);font-size:14px}
.sep span{flex:1;min-width:0}
.air{padding:6px 12px 12px;color:var(--acc);font-weight:600;font-size:14px}
  :root{--bg:#22222e;--panel:#2b2a3a;--p2:#353449;--fg:#ffffff;--mut:#9a9bab;--sub:#c4c5cf;--line:#3a394d;--acc:#1b92e4;--onacc:#ffffff;--top:#1b92e4;--ontop:#ffffff;--red:#e5484d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
  header{position:relative;z-index:5;padding:4px 12px 4px;padding-top:calc(4px + env(safe-area-inset-top))}
  @media (orientation:portrait){header{position:sticky;top:0;background:var(--bg)}}
  .hrow{display:flex;gap:8px;align-items:center;margin:4px 0}
  .sp{flex:1}
  button{background:var(--panel);color:var(--fg);border:0;border-radius:8px;padding:9px 14px;font:inherit}
  button.p{background:var(--acc);color:var(--onacc)}
  button.red,#stSave{background:var(--red)!important;color:#fff!important}
  header button:not(.ddb){padding:9px 11px}
  .dd2{gap:6px}
  .dd2 .ddb{flex:0 1 auto;min-width:0;font-size:13px}
  .dd2 .ddb:first-child{margin-right:auto}
  .ddb{background:none;padding:7px 0;font-size:15px;font-weight:600;color:var(--mut);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
  .ddb.act{color:var(--acc);font-weight:700}
  .menu{display:none;position:absolute;top:0;left:0;background:var(--panel);border-radius:10px;min-width:210px;z-index:20;box-shadow:0 8px 24px #000a;overflow:hidden}
  .menu.on{display:block}
  .menu button{display:flex;justify-content:space-between;gap:16px;width:100%;background:none;border-radius:0;padding:13px 14px;text-align:left}
  .menu button.cur{color:var(--acc);font-weight:700}
  .menu button span{color:var(--mut);font-weight:400}
  #grid,.res,.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  #grid{padding:8px 12px 40px}
  .c{aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--panel);position:relative}
  .c img{width:100%;height:100%;object-fit:cover;display:block}
  .c span{position:absolute;inset:auto 0 0 0;padding:4px;font-size:10px;background:linear-gradient(transparent,#000c)}
  .ck{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:#2ea043;color:#fff;font-style:normal;font-size:11px;line-height:18px;text-align:center}
  .it{cursor:pointer;min-width:0}
  .t{font-size:11px;line-height:1.25;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .y{font-size:10px;color:var(--mut);margin-top:1px}
  #grid.lst,.pg.lst{grid-template-columns:1fr!important;gap:10px}
  .it.row{display:flex;gap:12px;align-items:center}
  .it.row .c{width:64px;flex:none}
  .rinf{flex:1;min-width:0}
  .rinf .rt{font-size:15px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .rinf .rm{font-size:12px;color:var(--mut);margin-top:3px}
  .rinf .rg{font-size:12px;color:var(--mut);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .vc{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;position:relative;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--tk) 0)}
  .vc::before{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
  .vc b{position:relative;font-weight:700}
  #bView{padding:8px 12px}
  .yh{grid-column:1/-1;font-weight:700;font-size:16px;padding:12px 2px 2px}
  #empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
  .sheet{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column}
  .sheet.on{display:flex}
  .bar{display:flex;gap:8px;padding:10px 12px;align-items:center}
  .bar input{flex:1}
  input,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;min-width:0}
  .body{overflow:auto;padding:0 12px 24px;flex:1}
  .res .c,.pg .c{cursor:pointer}
  .res .c.done{opacity:.35}
  @media (orientation:portrait){#grid,.res,.pg{grid-template-columns:repeat(3,1fr)}}
  @media (orientation:landscape){#grid,.res,.pg{grid-template-columns:repeat(var(--cl,6),1fr)}}
  label{display:block;margin:14px 0 4px;color:var(--mut);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .msg{color:var(--mut);padding:16px 0}

  /* scheda */
  .fab{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:3;width:40px;height:40px;padding:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:40px}
  #detail .body{padding:0}
  .hero{height:190px;background:linear-gradient(135deg,var(--p2),var(--panel)) center/cover no-repeat}
  .hero i{display:block;height:100%;background:linear-gradient(transparent 40%,var(--bg))}
  .head{display:flex;gap:14px;padding:0 14px;align-items:flex-end}
  .head .c{width:clamp(110px,34vw,160px);flex:none;margin-top:-80px;margin-bottom:8px;box-shadow:0 6px 18px #000a;cursor:zoom-in}
  .info{padding-top:12px;min-width:0;align-self:flex-start}
  .info h2{margin:0 0 6px;font-size:21px;line-height:1.2}
  .sub{color:var(--mut)}
  .pad{padding:0 14px 28px}
  .genrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
  .genrow[hidden]{display:none}
  .gen{color:var(--sub);font-size:14px;flex:1;min-width:0}
  .trb{background:none;color:var(--acc);font-weight:600;font-size:14px;padding:6px 0 6px 10px;white-space:nowrap;flex:none}
  .trb[hidden]{display:none}
  .mrow{display:flex;gap:8px;overflow-x:auto;margin:4px 0 6px;padding-bottom:2px;scrollbar-width:none}
  .mrow::-webkit-scrollbar{display:none}
  .mrow button{flex:none;white-space:nowrap;background:var(--top);color:var(--ontop)}
  .csrow{margin-top:8px}
  .csrow{display:flex;gap:10px}
  .csrow button{flex:1 1 0;min-width:0;height:54px;background:var(--panel);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 12px}
  #dCs img{width:100%;height:auto;max-height:30px;object-fit:contain;display:block}
  #dNv img{width:100%;height:auto;max-height:34px;object-fit:contain;display:block}
  .trio{display:flex;gap:8px;margin-top:10px}
  .trio button{flex:1 1 0;min-width:0;padding:12px 4px;font-size:14px;line-height:1.2;white-space:normal}
  .trio:empty{display:none}
  .mlbtn{display:block;margin:18px auto 6px}
  .credit{text-align:center;color:var(--mut);font-size:10px;margin:22px 0 6px}
  .mgrp{margin-top:14px;padding-top:2px}
  .vote{width:46px;height:46px;margin-bottom:8px;position:relative}
  .vote[hidden]{display:none}
  .vote svg{display:block}
  .vote b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
  .vote b small{font-size:8px;font-weight:600;margin:-6px 0 0 1px}
  .links{display:flex;gap:30px;flex-wrap:wrap}
  .fab.home{left:auto;right:10px;display:flex;align-items:center;justify-content:center}
  .bar .hm{display:flex;align-items:center;justify-content:center;padding:9px 12px}
  .sh{margin:34px 0 0;font-size:17px;font-weight:700}
  .sh.first{margin-top:6px}
  .stats{display:flex;gap:12px;margin-top:12px}
  .spage[hidden]{display:none}
  .thr{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;margin-bottom:8px;border-radius:12px;font-size:16px;text-align:left;border:2px solid transparent}
  .thr.cur{border-color:var(--acc)}
  .pv{display:flex;flex:none;width:56px;height:34px;border-radius:6px;overflow:hidden;border:1px solid #8884}
  .pv i{flex:1}
  .cfld{margin-top:14px}
  .sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .sw button{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid #8886}
  .sw button.cur{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
  .credit a{color:inherit;text-decoration:underline}
  .gl{color:var(--acc);cursor:pointer}
  .stype{display:flex;gap:8px;padding:0 12px 6px}
  .stype button{flex:1;padding:9px}
  .stype button.on{background:var(--acc);color:var(--onacc)}
  #hist{margin:0 12px 6px;background:var(--panel);border-radius:10px;overflow:hidden}
  #hist[hidden]{display:none}
  #hist button{display:block;width:100%;text-align:left;background:none;padding:12px 14px;border-radius:0}
  #hist .hclear{color:var(--red);border-top:1px solid var(--line)}
  .sw button.auto{width:auto;border-radius:17px;padding:0 12px;font-size:13px}
  .sw input[type=color]{width:42px;height:34px;padding:0;border:0;background:none}
  .sc{flex:1;min-width:0;background:var(--panel);border-radius:16px;padding:16px 10px;text-align:center}
  .sc h4{margin:0;font-size:13px;letter-spacing:.5px;font-weight:600}
  .sc .big{font-size:22px;font-weight:700;margin:12px 0 6px}
  .sc .lab{font-size:13px}
  .sc .sm{font-size:12px;color:var(--mut);margin-top:8px}
  .savebar{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  .savebar button{width:100%;padding:13px}
  .ep .et{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  #dPlot{line-height:1.5;margin:18px 0 0;color:var(--sub)}
  .linkbtn{display:inline-block;background:none;padding:14px 4px 6px 0;color:var(--acc);font-weight:600}
  .linkbtn[hidden]{display:none}
  .cast{display:flex;gap:12px;overflow-x:auto;margin-top:16px;padding-bottom:14px}
  .cast:empty{display:none}
  .cast div{flex:none;width:72px;text-align:center;font-size:11px;line-height:1.2}
  .cast div.go{cursor:pointer}
  .cast img{width:60px;height:60px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 5px;background:var(--panel)}
  .cast em{display:block;font-style:normal;color:var(--mut);font-size:10px;margin-top:2px}
  .sec{margin:24px 0 0;font-size:15px;font-weight:700}
  .sgrow{display:flex;gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:14px}
  .sgi{flex:none;width:92px;cursor:pointer}
  .prog{margin-top:18px;background:var(--panel);border-radius:12px;padding:12px 14px}
  .pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--acc);width:0}
  .prow{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px;font-size:18px}
  .prow button{width:44px;height:40px;padding:0;font-size:20px;background:var(--p2)}
  .prow .lnk{background:none;padding:0;font-size:18px;width:auto;height:auto;text-decoration:underline dotted;color:var(--fg)}

  /* episodi */
  .ep{background:var(--panel);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .still{aspect-ratio:16/9;background:#000}
  .still img{width:100%;height:100%;object-fit:cover;display:block}
  .ep .et{padding:10px 12px 0;font-weight:700}
  .ep .eo{padding:6px 12px 12px;color:var(--sub);line-height:1.45;font-size:14px}
  .ep .et:last-child{padding-bottom:12px}

  /* attore */
  .ahd{display:flex;align-items:center;gap:14px;padding:6px 0 4px}
  .ahd img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--panel)}
  .anm{font-size:20px;font-weight:700}

  /* trailer e zoom */
  #trailer{background:#000}
  .tbox{width:min(100%,calc((100vh - 120px)*16/9));aspect-ratio:16/9;margin:0 auto;background:#111}
  .tbox iframe{width:100%;height:100%;border:0;display:block}
  .tyt{display:block;text-align:center;color:var(--acc);padding:16px;font-weight:600}
  #zoom{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center}
  #zoom.on{display:flex}
  #zoom img{max-width:94vw;max-height:92vh;object-fit:contain;border-radius:8px}

  /* scelta lista */
  #toTop{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:55;width:46px;height:46px;border-radius:50%;padding:0;background:rgba(0,0,0,.5);color:#fff;display:none;align-items:center;justify-content:center;opacity:.7}
  #toTop.on{display:flex}
  .pgb{margin-top:6px}
  .pgb .pt{font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
  .pgb .pbar{height:4px;margin-top:3px}
  .pgb .pbtn{display:flex;gap:6px;margin-top:6px}
  .pgb .pbtn button{flex:1;padding:0;height:30px;font-size:18px;line-height:30px;background:var(--p2)}
  .xs{margin-top:18px}
  .xh{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
  .xh b{font-size:20px}
  .xh a{color:var(--acc);font-weight:600;font-size:15px;cursor:pointer}
  .xrow{display:flex;gap:12px;overflow-x:auto;margin-top:10px;padding-bottom:6px;scrollbar-width:none}
  .xrow::-webkit-scrollbar{display:none}
  .xc{flex:none;width:min(40vw,190px);background:var(--panel);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
  .xc .c{border-radius:0;aspect-ratio:2/3}
  .xc .xi{padding:10px 10px 12px}
  .xc .xt{font-size:15px;font-weight:600;line-height:1.25;height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .xc .xm{font-size:12px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xc.all{display:flex;align-items:center;justify-content:center;aspect-ratio:auto;min-height:200px;color:var(--acc);font-weight:600}
  #dlg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:24px}
  #dlg.on{display:flex}
  .dlgbox{background:var(--panel);border-radius:16px;padding:20px;width:100%;max-width:340px}
  #dlgMsg{font-size:16px;line-height:1.4;margin-bottom:16px}
  #dlgIn{width:100%;margin-bottom:16px}
  #dlgIn[hidden]{display:none}
  .dlgbtns{display:flex;gap:8px;justify-content:flex-end}
  .dlgbtns button{padding:11px 18px}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:88vw;background:var(--p2);color:var(--fg);padding:12px 16px;border-radius:12px;z-index:80;display:none;font-size:14px;text-align:center;box-shadow:0 8px 24px #000a}
  #toast.on{display:block}
  #pick{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
  #pick.on{display:flex}
  .pickbox{background:var(--panel);width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:8px}
  .pickbox h3{margin:0 0 6px;font-size:15px}
  .pickbox button{background:var(--p2);padding:14px}
</style>
</head>

 light:{bg:'#f3f4f8',panel:'#ffffff',p2:'#e4e6ee',fg:'#1a1b24',mut:'#6b6e7e',sub:'#3a3c4a',line:'#d5d8e0',acc:'#1b92e4',top:'#1b92e4'},
 green:{bg:'#22222e',panel:'#2b2a3a',p2:'#353449',fg:'#ffffff',mut:'#9a9bab',sub:'#c4c5cf',line:'#3a394d',acc:'#76ca92',top:'#76ca92'}};
const PASTEL=['#CA7687','#CAB476','#76A2CA','#76CA92','#9776CA'];
const h2r=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const r2h=r=>'#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mixc=(a,b,k)=>{const A=h2r(a),B=h2r(b);return r2h(A.map((v,i)=>v+(B[i]-v)*k))};
const lumOf=h=>{const [r,g,b]=h2r(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const onCol=h=>lumOf(h)>0.4?'#10111a':'#ffffff';
function themeVals(){
  const nm=cfg.theme||'def';
  if(nm!=='custom')return THEMES[nm]||THEMES.def;
  const c=cfg.cust||{},bg=c.bg||THEMES.def.bg,dark=lumOf(bg)<0.4;
  const fg=c.text||(dark?'#ffffff':'#1a1b24'),pole=dark?'#ffffff':'#000000';
  return {bg,panel:mixc(bg,pole,.07),p2:mixc(bg,pole,.14),fg,mut:mixc(fg,bg,.45),sub:mixc(fg,bg,.2),line:mixc(bg,pole,.16),acc:c.acc||THEMES.def.acc,top:c.top||THEMES.def.top};
}
function applyTheme(){
  const T=themeVals(),st=document.documentElement.style;
  ['bg','panel','p2','fg','mut','sub','line','acc','top'].forEach(k=>st.setProperty('--'+k,T[k]));
  document.documentElement.dataset.light=lumOf(T.bg)>=0.4?'1':'0';
  st.setProperty('--onacc',onCol(T.acc));st.setProperty('--ontop',onCol(T.top));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=T.bg;
}
function saveCfg(){try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(e){}}
function buildThemes(){
  const L=$('#thList');L.innerHTML='';
  [['def','th_def'],['dark','th_dark'],['light','th_light'],['green','th_green'],['custom','th_custom']].forEach(([k,lab])=>{
    const T=k==='custom'?(()=>{const sv=cfg.theme;cfg.theme='custom';const v=themeVals();cfg.theme=sv;return v})():THEMES[k];
    const b=document.createElement('button');b.className='thr'+((cfg.theme||'def')===k?' cur':'');
    b.innerHTML=`<span class="pv"><i style="background:${T.bg}"></i><i style="background:${T.panel}"></i><i style="background:${T.acc}"></i></span><span>${t(lab)}</span>`;
    b.onclick=()=>{cfg.theme=k;saveCfg();applyTheme();buildThemes()};
    L.appendChild(b);
  });
  const C=$('#thCust');C.hidden=(cfg.theme||'def')!=='custom';C.innerHTML='';
  if(C.hidden)return;
  [['bg','c_bg'],['acc','c_acc'],['top','c_top'],['text','c_text']].forEach(([f,lab])=>{
    const d=document.createElement('div');d.className='cfld';
    d.innerHTML=`<label>${t(lab)}</label>`;
    const sw=document.createElement('div');sw.className='sw';
    const set=v=>{cfg.cust=cfg.cust||{};if(v)cfg.cust[f]=v;else delete cfg.cust[f];saveCfg();applyTheme();buildThemes()};
    if(f==='text'){const a=document.createElement('button');a.className='auto'+(((cfg.cust||{}).text)?'':' cur');a.textContent=t('c_auto');a.onclick=()=>set('');sw.appendChild(a)}
    const curv=((cfg.cust||{})[f]||(f==='text'?'':THEMES.def[f])||'').toLowerCase();
    const base=f==='bg'?['#22222e','#0b0b0f','#f3f4f8']:f==='text'?['#ffffff','#1a1b24']:['#1b92e4','#e5484d'];
    [...base,...PASTEL].forEach(c=>{const b=document.createElement('button');b.style.background=c;if(c.toLowerCase()===curv)b.classList.add('cur');b.onclick=()=>set(c);sw.appendChild(b)});
    const inp=document.createElement('input');inp.type='color';inp.value=(cfg.cust&&cfg.cust[f])||(f==='text'?themeVals().fg:themeVals()[f]);
    inp.onchange=()=>set(inp.value);sw.appendChild(inp);
    d.appendChild(sw);C.appendChild(d);
  });
}

function isEn(t){
  const w=(t||'').toLowerCase().match(/[a-zàèéìòù']+/g)||[];
  if(w.length<4)return false;
  let e=0,i=0;w.forEach(x=>{if(EN_W.has(x))e++;if(IT_W.has(x))i++});
  return e>=1&&e>i;
}
async function translate(text,lg){
  lg=lg||trLang();
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl='+lg+'&dt=t&q='+encodeURIComponent(text));
    if(!r.ok)throw 0;
    const j=await r.json();
    const out=(j[0]||[]).map(x=>x[0]||'').join('');
    if(out)return out;
  }catch(e){}
  try{
    const parts=text.match(/[^.!?]+[.!?]*\s*/g)||[text],chunks=[];let c='';
    parts.forEach(p=>{if((c+p).length>450&&c){chunks.push(c);c=''}c+=p});
    if(c)chunks.push(c);
    const outs=[];
    for(const q of chunks){
      const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|'+lg+'&q='+encodeURIComponent(q));
      const j=await r.json();
      if(!j.responseData||j.responseStatus!=200)throw 0;
      outs.push(j.responseData.translatedText);
    }
    const o=outs.join(' ').trim();
    if(o)return o;
  }catch(e){}
  throw new Error(t('tr_fail'));
}

const LAY={search:'#search',detail:'#detail',eps:'#eps',actor:'#actor',trailer:'#trailer',settings:'#settings',sec:'#secL',explore:'#explore',mlist:'#mlist',dlg:'#dlg',seas:'#seas',gal:'#gal',pick:'#pick',menu:'#menu',zoom:'#zoom'};
const TOPL=['explore','mlist','actor','eps','seas','gal','search','detail','settings'];
function topScroller(){
  const last=stack[stack.length-1];
  if(['trailer','zoom'].includes(last))return null;
  for(let i=stack.length-1;i>=0;i--)if(TOPL.includes(stack[i]))return $(LAY[stack[i]]).querySelector('.body');
  return document.scrollingElement;
}
function updTop(){
  const e=topScroller();
  const y=!e?0:(e===document.scrollingElement?window.scrollY:e.scrollTop);
  $('#toTop').classList.toggle('on',y>600);
}
document.addEventListener('scroll',updTop,true);
$('#toTop').onclick=()=>{const e=topScroller();if(e)(e===document.scrollingElement?window:e).scrollTo({top:0,behavior:'smooth'})};
function zfix(){
  setTimeout(updTop,40);
  Object.keys(LAY).forEach(n=>{
    const i=stack.lastIndexOf(n);
    $(LAY[n]).style.zIndex=i<0?'':String(10+i*2);
  });
}
function openLayer(n,dup){
  if(!dup&&stack.includes(n))return;
  $(LAY[n]).classList.add('on');
  stack.push(n);
  zfix();
  try{history.pushState({l:n},'')}catch(e){}
}
function closeLayer(n){
  if(!stack.includes(n))return;
  if(stack[stack.length-1]===n){history.back();return}
  stack.splice(stack.lastIndexOf(n),1);
  if(!stack.includes(n))$(LAY[n]).classList.remove('on');
  zfix();
}
window.addEventListener('popstate',()=>{
  const n=stack.pop();
  if(!n)return;
  if(n==='pick')pending=null;
  if(n==='search')clearSearch();
  if(n==='mlist'&&mlStack.length){mlCur=mlStack.pop();$('#mTitle').textContent=mlCur.title||'';drawMl();$('#mlist .body').scrollTop=mlCur.y||0}
  if(n==='trailer')$('#tBox').innerHTML='';
  if(n==='dlg'&&dlgRes){const r=dlgRes;dlgRes=null;setTimeout(()=>r.res(r.val),0)}
  if(n==='sec')showSecHome();
  if(n==='sec'&&settingsDirty())setTimeout(()=>dlg({msg:t('save_q'),yes:t('save'),no:t('discard'),danger:true}).then(y=>{if(y)saveSettings()}),0);
  if(n==='actor'){
    astack.pop();
    if(astack.length){
      const e=astack[astack.length-1];
      renderActor(e.a).then(()=>{$('#aBody').scrollTop=e.y});
    }
  }
  if(n==='detail'){
    dstack.pop();
    if(dstack.length){
      const e=dstack[dstack.length-1];
      cur=e.s;renderDetail();$('#detail .body').scrollTop=e.y;
    }else cur=null;
  }
  if(!stack.includes(n))$(LAY[n]).classList.remove('on');
  zfix();
  if(homing){if(stack.length)history.back();else homing=false}
});
function goHome(){
  if(!stack.length)return;
  homing=true;history.back();
}

      if(seasN(s)){clearTimeout(seasSv);seasSv=setTimeout(save,800);if(m.isConnected){m.textContent=rowInfo(s);addSeasonLink(m,s)}}

async function tmdb(path,params={}){
  const k=(cfg.tmdb||'').trim();
  if(!k){const e=new Error(t('err_key'));e.fatal=true;throw e}
  const u=new URL('https://api.themoviedb.org/3'+path);
  Object.entries(params).forEach(([a,b])=>u.searchParams.set(a,b));
  const o={};
  if(k.length>40) o.headers={Authorization:'Bearer '+k}; else u.searchParams.set('api_key',k);
  const r=await fetch(u,o);
  if(!r.ok){const e=new Error(t('err_tmdb',r.status)+(r.status==401?t('err_badkey'):''));e.fatal=r.status==401;throw e}
  return r.json();
}

function buildCrew(T,d,cr,ag){

  if(T==='tv'){
    (d.created_by||[]).forEach(p=>cre.push({id:p.id,name:p.name,profile_path:p.profile_path}));
    const min=Math.min(2,Math.max(1,d.number_of_episodes||1));
    const dn=[],wn=[];

      let dc=0,wc=0;
      (p.jobs||[]).forEach(j=>{if(j.job==='Director')dc+=j.episode_count||0;else if(/^(Writer|Screenplay|Teleplay)$/.test(j.job))wc+=j.episode_count||0});
      if(dc>=min)dn.push([dc,p]);if(wc>=min)wn.push([wc,p]);
    });
    dn.sort((a,b)=>b[0]-a[0]).slice(0,6).forEach(x=>dir.push(x[1]));
    wn.sort((a,b)=>b[0]-a[0]).slice(0,6).forEach(x=>wri.push(x[1]));
  }else{
    ((cr&&cr.crew)||[]).forEach(p=>{
      if(p.job==='Director')dir.push(p);
      else if(p.job==='Writer'||p.job==='Screenplay')wri.push(p);
    });

  const m=new Map();

/* durata totale di una serie: somma delle durate di tutti gli episodi (per le statistiche) */
async function calcMin(s){
  if(s.ert===undefined){
    const d=await tmdb(`/tv/${s.id}`,{language:'en-US'});
    s.ert=(d.episode_run_time&&d.episode_run_time[0])||(d.last_episode_to_air&&d.last_episode_to_air.runtime)||0;
  }
  let sum=0,known=0,cnt=0;
  for(const x of (s.seasons||[])){
    const j=await tmdb(`/tv/${s.id}/season/${x.n}`,{language:'en-US'});
    (j.episodes||[]).forEach(e=>{cnt++;if(e.runtime>0){sum+=e.runtime;known++}});
  }
  if(!cnt)s.m=(s.ert||0)*total(s);
  else{
    const avg=known?sum/known:(s.ert||0);
    s.m=Math.round(sum+(cnt-known)*avg);
  }
  s.mok=s.m>0;s.ms=1;
}

async function fetchSugg(s){
  const T=ty(s),seen=new Set([s.id]),out=[];
  let ok=false;
  const add=r=>{
    if((sgMode()==='all'||r.original_language==='ko')&&r.poster_path&&!seen.has(r.id)){
      seen.add(r.id);
      out.push({id:r.id,n:r.name||r.title||'',y:(r.first_air_date||r.release_date||'').slice(0,4),p:r.poster_path});
    }
  };
  for(const pg of [1,2]){
    try{
      const j=await tmdb(`/${T}/${s.id}/recommendations`,{language:'en-US',page:pg});
      ok=true;(j.results||[]).forEach(add);
      if((j.total_pages||1)<=pg)break;
    }catch(e){break}
  }
  if(out.length<10){
    const p={language:'en-US',sort_by:'popularity.desc','vote_count.gte':50,page:1};
    if(sgMode()==='ko')p.with_original_language='ko';
    const g=(s.gi||[]).slice(0,2).join('|');
    if(g)p.with_genres=g;
    try{
      const j=await tmdb(`/discover/${T}`,p);
      ok=true;(j.results||[]).forEach(r=>{if(out.length<12)add(r)});
    }catch(e){}
  }
  return ok?out.slice(0,12):null;
}

async function getFilmo(id,mode){
  const key=mode==='crew'?id+'c':id;
  if(ac.data[key])return ac.data[key];
  const j=await tmdb(`/person/${id}/combined_credits`,{language:'en-US'});
  const seen=new Set(),out=[];
  if(mode==='crew'){
    const m=new Map();
    (j.crew||[]).forEach(r=>{
      const c=CJ[r.job];if(!c)return;
      const t=r.media_type;if(t!=='tv'&&t!=='movie')return;
      if((r.genre_ids||[]).some(g=>SKIP_G.includes(g)))return;
      const k=t+r.id;let e=m.get(k);
      if(!e){const d=r.first_air_date||r.release_date||'';e={t,id:r.id,n:r.name||r.title||'',y:d.slice(0,4),d,p:r.poster_path||'',roles:[]};m.set(k,e);out.push(e)}
      if(!e.roles.includes(c))e.roles.push(c);
    });
    out.forEach(e=>e.roles.sort((a,b)=>'cdw'.indexOf(a)-'cdw'.indexOf(b)));
  }else
  (j.cast||[]).forEach(r=>{
    const t=r.media_type;
    if(t!=='tv'&&t!=='movie')return;
    if((r.genre_ids||[]).some(g=>SKIP_G.includes(g)))return;
    const k=t+r.id;if(seen.has(k))return;seen.add(k);
    const d=r.first_air_date||r.release_date||'';
    out.push({t,id:r.id,n:r.name||r.title||'',y:d.slice(0,4),d,p:r.poster_path||''});
  });
  out.sort((a,b)=>(!a.d&&b.d)?1:(a.d&&!b.d)?-1:b.d.localeCompare(a.d));
  ac.data[key]=out;ac.order=ac.order.filter(x=>x!==key);ac.order.push(key);
  while(ac.order.length>15)delete ac.data[ac.order.shift()];
  try{localStorage.setItem('ac',JSON.stringify(ac))}catch(e){}
  return out;
}

  const B=new Date(b+'T00:00:00Z'),E=d?new Date(d+'T00:00:00Z'):new Date();
  let a=E.getUTCFullYear()-B.getUTCFullYear();
  const m=E.getUTCMonth()-B.getUTCMonth();
  if(m<0||(m===0&&E.getUTCDate()<B.getUTCDate()))a--;
  return a;
}

let seasS=null;const seasOpen=new Set();
const seasOf=s=>(s.seasons||[]).slice().sort((a,b)=>a.n-b.n);
function seasBounds(s){let a=0;return seasOf(s).map(x=>{const r={n:x.n,c:x.c,from:a,to:a+x.c};a+=x.c;return r})}
async function getSeasonEps(s,n){
  const key=s.id+'_'+n;
  if(!epc[key]||epc[key].some(x=>x.d===undefined)){
    const j=await tmdb(`/tv/${s.id}/season/${n}`,{language:'en-US'});
    epc[key]=(j.episodes||[]).map(e=>({e:e.episode_number,t:e.name||'',o:e.overview||'',i:e.still_path||'',d:e.air_date||''}));
    saveEps();
  }
  return epc[key];
}
function openSeas(s){
  if(!seasN(s))return;
  seasS=s;seasOpen.clear();$('#sTitle').textContent=s.name;
  $('#sList').scrollTop=0;drawSeas();openLayer('seas');
}
function tickEl(on,fn){
  const k=document.createElement('button');k.className='tk'+(on?' on':'');k.textContent='✓';
  k.setAttribute('aria-pressed',on?'true':'false');k.onclick=fn;return k;
}
function drawSeas(){
  const s=seasS;if(!s)return;
  const L=$('#sList'),y=L.scrollTop;L.innerHTML='';
  const p=s.prog||0;
  seasBounds(s).forEach(b=>{
    const done=Math.max(0,Math.min(b.c,p-b.from)),open=seasOpen.has(b.n);
    const w=document.createElement('div');w.className='seasbox';w.dataset.sn=b.n;
    const h=document.createElement('div');h.className='sh2';
    const nb=document.createElement('button');nb.className='sn';
    nb.textContent=`${t('season_n',b.n)} · ${done}/${b.c}  ${open?'▴':'▾'}`;
    nb.onclick=()=>{if(open)seasOpen.delete(b.n);else seasOpen.add(b.n);drawSeas();if(!open)getSeasonEps(s,b.n).then(()=>{if(seasS===s&&seasOpen.has(b.n))drawSeas()}).catch(()=>{})};
    const full=p>=b.to;
    h.append(nb,tickEl(full,()=>setProg(s,full?b.from:b.to)));
    w.appendChild(h);
    if(open){
      const eps=epc[s.id+'_'+b.n]||[];
      for(let i=1;i<=b.c;i++){
        const ep=eps[i-1],abs=b.from+i,on=p>=abs;
        const r=document.createElement('div');r.className='sep';
        const sp=document.createElement('span');sp.textContent=`E${ep?ep.e:i} · ${(ep&&ep.t)||t('episode_n',ep?ep.e:i)}`;
        r.append(sp,tickEl(on,()=>setProg(s,on?abs-1:abs)));
        w.appendChild(r);
      }
    }
    L.appendChild(w);
  });
  L.scrollTop=y;
}
const seasP=(b,i)=>i===0?0:b[i-1].to;
async function askSeasons(s,p){
  await ensureSeasons(s);
  const b=seasBounds(s);
  if(b.length<2)return -1;
  let sel=0;for(let i=1;i<=b.length;i++)if(b[i-1].to<=p)sel=i;
  const ch=[t('seas_none')];b.forEach((x,i)=>ch.push(i===b.length-1?t('seas_all'):t('seas_upto',x.n)));
  const v=await dlg({msg:t('seas_q'),choices:ch,sel});
  return v===null||v===false?null:v;
}
/* applica la scelta delle stagioni; restituisce la lista di destinazione */
function applySeasonChoice(s,r,k){
  const b=seasBounds(s);
  if(r===b.length&&b.length>=2){s.prog=total(s)||b[b.length-1].to;return 'viste'}
  s.prog=seasP(b,r);return k;
}
async function moveTo(s,k){
  const from=s.list,T=ty(s),act=l=>l==='guardando'||l==='abbandonate';
  if(T==='tv'){
    const askIt=(k==='guardando'&&from!=='guardando')||(k==='abbandonate'&&!act(from));
    if(askIt){
      const r=await askSeasons(s,s.prog||0);
      if(r===null)return;
      if(r>=0)k=applySeasonChoice(s,r,k);
    }else if(k==='viste'){s.prog=total(s)||s.prog||0}
    else if(k==='vedere'||k==='indeciso')s.prog=0;
  }
  s.list=k;save();render();if(cur===s)renderDetail();
}

async function mdbFetch(path,off){

  try{r=await fetch(`https://api.mdblist.com/lists/${path}/items?apikey=${encodeURIComponent(key)}&limit=${ML_LIM}&offset=${off}`)}
  catch(e){throw new Error(t('mdb_net'))}
  if(!r.ok)throw new Error(t('mdb_err',r.status)+(r.status===401||r.status===403?t('mdb_badkey'):r.status===404?t('mdb_404'):''));
  const j=await r.json();
  let arr;
  if(Array.isArray(j))arr=j;
  else arr=[...(j.movies||[]).map(x=>({...x,mediatype:x.mediatype||'movie'})),...(j.shows||[]).map(x=>({...x,mediatype:x.mediatype||'show'}))].sort((a,b)=>(a.rank||0)-(b.rank||0));
  const items=[];
  arr.forEach(x=>{
    const id=x.tmdb_id||x.id;if(!id)return;
    const gr=x.genre||x.genres;let g=[];
    if(Array.isArray(gr))g=gr.map(q=>typeof q==='string'?q:(q&&(q.title||q.name))||'');
    else if(typeof gr==='string')g=gr.split(/[,|]/);
    g=g.map(z=>String(z).trim().replace(/-/g,' ')).filter(Boolean).map(z=>z[0].toUpperCase()+z.slice(1)).slice(0,3);
    items.push({t:x.mediatype==='movie'?'movie':'tv',id,n:x.title||x.name||'',y:String(x.release_year||x.year||''),g});
  });
  return {items,more:arr.length>=ML_LIM};
}

async function loadGenre(){
  const c=mlCur,tok=c.tok;$('#mMore').disabled=true;
  try{
    const p={language:'en-US',with_genres:String(c.gid),sort_by:'popularity.desc','vote_count.gte':30,page:c.page+1};
    if(sgMode()==='ko')p.with_original_language='ko';
    const j=await tmdb('/discover/'+c.T,p);
    if(tok!==mlTok)return;
    c.page++;
    const seen=new Set(c.items.map(x=>x.t+x.id));
    (j.results||[]).forEach(r=>{
      if(!r.poster_path||seen.has(c.T+r.id))return;seen.add(c.T+r.id);
      c.items.push({t:c.T,id:r.id,n:r.name||r.title||'',y:(r.first_air_date||r.release_date||'').slice(0,4),p:r.poster_path,g:[]});
    });
    c.more=c.page<(j.total_pages||1)&&c.page<50;
    drawMl();
  }catch(e){
    if(tok!==mlTok)return;
    $('#mMsg').textContent=e.message;$('#mMore').disabled=false;
  }
}
async function loadMl(force){
  const c=mlCur,tok=c.tok;
  if(c.kind==='genre')return loadGenre();
  if(!c.items.length&&!force&&ml[c.path]&&ml[c.path].v===2&&Date.now()-ml[c.path].t<6*3600e3){
    c.items=ml[c.path].items.slice();c.more=ml[c.path].more;drawMl();return;
  }
  $('#mMore').disabled=true;
  try{
    const r=await mdbFetch(c.path,c.items.length);
    if(tok!==mlTok)return;
    const seen=new Set(c.items.map(x=>x.t+x.id));
    r.items.forEach(x=>{if(!seen.has(x.t+x.id)){seen.add(x.t+x.id);c.items.push(x)}});
    c.more=r.more;
    if(c.items.length<=ML_LIM){ml[c.path]={v:2,t:Date.now(),items:c.items.slice(),more:c.more};try{localStorage.setItem('ml',JSON.stringify(ml))}catch(e){}}
    drawMl();
  }catch(e){
    if(tok!==mlTok)return;
    $('#mMsg').textContent=e.message;$('#mMore').disabled=false;
  }
}
function drawMl(){

    if(lst){G.appendChild(listRow({t:x.t,id:x.id,n:x.n,y:x.y,p:x.p||'',g:x.g}));return}

}
const XN=24;
async function mlFirst(path){
  const c=ml[path];
  if(c&&c.v===2&&Date.now()-c.t<6*3600e3)return c.items;
  const r=await mdbFetch(path,0);
  ml[path]={v:2,t:Date.now(),items:r.items.slice(),more:r.more};
  try{localStorage.setItem('ml',JSON.stringify(ml))}catch(e){}
  return r.items;
}
const xObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){xObs.unobserve(e.target);if(e.target._f)e.target._f()}}),{rootMargin:'400px'});

function fmtT(m){
  const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60,p=[];
  if(d)p.push(d+'d');if(h)p.push(h+'h');if(mm||!p.length)p.push(mm+'m');
  return p.join(' ');
}
function calcStats(){
  const r={tv:{min:0,eps:0,n:0,pend:0,miss:0},movie:{min:0,n:0,pend:0,miss:0}};
  db.forEach(s=>{
    const t=ty(s);if(s.list!==DEF[t])return;
    const o=r[t];o.n++;
    if(t==='tv'){o.eps+=total(s);if(s.ms!==1)o.pend++;else if(!s.mok)o.miss++;o.min+=s.m||0}
    else{if(s.v!==3)o.pend++;else if(!s.runtime)o.miss++;o.min+=s.runtime||0}
  });
  return r;
}
function renderStats(note){
  const r=calcStats();
  $('#stTvT').textContent=fmtT(r.tv.min);
  $('#stTvN').textContent=t('st_series',r.tv.eps,r.tv.n);
  $('#stMvT').textContent=fmtT(r.movie.min);
  $('#stMvN').textContent=t('st_movies',r.movie.n);
  if(note!==undefined){$('#stMsg').textContent=note;return}
  const pend=r.tv.pend+r.movie.pend,miss=r.tv.miss+r.movie.miss,parts=[];
  if(pend)parts.push(t('st_pend',pend));
  if(miss)parts.push(t('st_miss',miss));
  $('#stMsg').textContent=parts.join(' ');
}

  const tot=todo.length;let n=0,err=0,last='',stop=false;
  $('#stUpd').disabled=true;
  const worker=async()=>{
    while(todo.length&&!stop){
      const s=todo.shift();
      try{
        if(s.v!==3)await fetchMeta(s);
        if(ty(s)==='tv')await calcMin(s);
      }catch(e){err++;last=e.message;if(e.fatal)stop=true}
      renderStats(t('st_calc',++n,tot));
    }
  };

};

/* ---------- aggiornamenti ---------- */
const verNum=v=>String(v||'').replace(/^[^\d]*/,'').split(/[.\-+]/).map(x=>parseInt(x,10)||0);
const verCmp=(a,b)=>{a=verNum(a);b=verNum(b);for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d>0?1:-1}return 0};
$('#updChk').onclick=async()=>{
  const b=$('#updChk');b.disabled=true;
  try{
    const r=await fetch('https://api.github.com/repos/'+REPO+'/releases/latest',{headers:{Accept:'application/vnd.github+json'}});
    if(r.status===404){toast(t('upd_none',APP_VERSION));b.disabled=false;return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json(),tag=String(j.tag_name||j.name||'');
    if(verCmp(tag,APP_VERSION)>0){
      const as=(j.assets||[]).find(x=>/\.apk$/i.test(x.name||''));
      const url=as?as.browser_download_url:j.html_url;
      const y=await dlg({msg:t('upd_new',tag.replace(/^[^\d]*/,'')),yes:t('upd_go')});
      if(y&&url){
        const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';
        document.body.appendChild(a);a.click();a.remove();
        toast(t('upd_dl'));
      }
    }else toast(t('upd_none',APP_VERSION));
  }catch(e){toast(t('upd_err',e.message))}
  b.disabled=false;
};

/* ---------- aggiornamento automatico (voti e dettagli), al massimo una volta a settimana ---------- */
async function autoRefresh(force){
  if(autoRefresh.run||(!force&&navigator.webdriver))return;
  let last=0;try{last=+localStorage.getItem('arf')||0}catch(e){}
  if(!db.length||(!force&&Date.now()-last<6048e5))return;
  autoRefresh.run=true;
  let fatal=false;
  try{
    const old=s=>s.v!==3||s.va===undefined||s.imdb===undefined||s.ol!=='en'||s.cn!==16;
    const meta=db.filter(old);
    let i=0;
    for(const s of meta){
      try{await fetchMeta(s)}catch(e){if(e.fatal){fatal=true;break}}
      if(++i%10===0)save();
    }
    if(!fatal){
      const todo=db.filter(s=>!meta.includes(s));
      const worker=async()=>{
        while(todo.length&&!fatal){
          const s=todo.shift();
          try{const d=await tmdb(`/${ty(s)}/${s.id}`,{language:'en-US'});s.va=d.vote_average||0;s.vc=d.vote_count||0}
          catch(e){if(e.fatal)fatal=true}
        }
      };
      await Promise.all([worker(),worker(),worker()]);
    }
    save();render();
    if(cur&&$('#detail').classList.contains('on'))renderDetailIf(cur);
    if(!fatal)try{localStorage.setItem('arf',String(Date.now()))}catch(e){}
  }catch(e){}
  autoRefresh.run=false;
}
setTimeout(autoRefresh,4000);
